<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" id="metaTema" content="#F3EDE2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Mascota">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Mi Mascota</title>
<meta name="description" content="App personal para la salud, el peso y los documentos de mi perro.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Tarjetas con sombra difusa; crema + azul petróleo */
:root{
  /* Crema + azul petróleo oscuro; arena como tono de apoyo (pelo canela, sin marrones) */
  --bg:#F3EDE2;--card:#FFFCF6;--ink:#1D2B33;--muted:#6A675E;--line:#ECE4D6;
  --verde:#1F4B57;--verde2:#E9E1D2;--verde3:#2C6170;--terra:#1F4B57;--terra2:#EFE7DA;
  --ambar:#A9741C;--ambar2:#F8EDD6;--rojo:#B84535;--rojo2:#F8E2DC;
  --panel:#E0D3BD;--sobre:#FFFCF6;--vidrio:rgba(255,251,244,.58);--vidrio-borde:rgba(255,255,255,.55);--banda:#1F4B57;--banda-txt:#F6F0E6;
  --sombra:0 14px 34px rgba(38,46,52,.09),0 2px 6px rgba(38,46,52,.05);
  --sombra-btn:0 10px 22px rgba(31,75,87,.30);
  --r:24px;
  --f:'Nunito','Avenir Next',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#13191C;--card:#1C2428;--ink:#EDE8DE;--muted:#9A9A92;--line:#2A3337;
  --verde:#8FC3CF;--verde2:#25323A;--verde3:#6FAAB8;--terra:#8FC3CF;--terra2:#25323A;
  --ambar:#E6BA68;--ambar2:#352C1A;--rojo:#F08A7A;--rojo2:#3A2421;
  --panel:#2B3236;--sobre:#10232A;--vidrio:rgba(28,36,40,.55);--vidrio-borde:rgba(255,255,255,.10);--banda:#0C1416;--banda-txt:#EDE8DE;
  --sombra:0 10px 28px rgba(0,0,0,.35);--sombra-btn:0 8px 20px rgba(0,0,0,.4);
  color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f);-webkit-text-size-adjust:100%}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--f);font-weight:800;letter-spacing:-.01em;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--verde)}
.ic{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.2em;flex:none}

header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);color:var(--ink);padding:calc(env(safe-area-inset-top) + 12px) 20px 10px;display:flex;align-items:center;gap:12px;max-width:760px;margin:0 auto}
header.top h1{font-size:24px;flex:1;text-align:center;color:inherit}
header.top{max-width:none;margin:0}
.estado{width:10px;height:10px;border-radius:50%;background:var(--muted);opacity:.35;flex:none;border:0;padding:0}
header.top h1 .estado{display:inline-block;vertical-align:middle;margin:0 0 0 8px;width:11px;height:11px;position:relative;top:-2px}
header.top h1 .estado::after{content:"";position:absolute;inset:-12px}
.estado.ok{box-shadow:0 0 0 3px color-mix(in srgb,var(--verde) 22%,transparent)}
.estado.ok{background:#2E9E6A;opacity:1}
.estado.sync{background:var(--ambar);opacity:1;animation:lat 1s infinite}
.estado.error{background:var(--rojo);opacity:1}
@keyframes lat{50%{opacity:.25}}

main{max-width:760px;margin:0 auto;padding:4px 20px 24px}
.vista{display:none}.vista.activa{display:block;animation:entra .25s ease}
@keyframes entra{from{opacity:0;transform:translateY(8px)}}
.card{background:var(--card);border-radius:var(--r);padding:8px 18px;box-shadow:var(--sombra);margin-bottom:14px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 4px 12px}
.sec h2{font-size:18px}
.link{border:0;background:none;color:var(--verde);font-weight:700;font-size:14px;padding:4px 0}
.s{color:var(--muted);font-size:13.5px}

/* Ficha estilo «perfil de adopción» */
.hero{position:relative;margin:-4px -20px 0;cursor:pointer}
.hero-foto{height:min(94vw,376px);border-radius:0 0 34px 34px;background:var(--panel) center 35%/cover no-repeat;display:grid;place-items:center;color:color-mix(in srgb,var(--verde) 55%,var(--panel));overflow:hidden;position:relative}
.hero-foto .silueta{width:130px;height:130px;margin-top:-80px}
.hero-card{position:absolute;left:16px;right:16px;bottom:16px;background:var(--vidrio);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--vidrio-borde);border-radius:var(--r);box-shadow:0 10px 30px rgba(20,30,36,.18);padding:16px 20px}
.hc-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hc-top h2{font-size:26px}
.sexo{color:var(--verde);display:grid;place-items:center}.sexo svg{width:24px;height:24px}
.hc-sub{color:var(--ink);font-size:15px;margin-top:2px;font-weight:700;overflow-wrap:anywhere}
.hc-sub span:last-child{color:var(--ink);opacity:.7;font-weight:600}
.hc-loc{display:flex;gap:6px 16px;flex-wrap:wrap;font-variant-numeric:tabular-nums;color:var(--ink);opacity:.8;font-size:13.5px;margin-top:8px}
.hc-loc span{display:flex;align-items:center;gap:5px}.hc-loc .ic{color:var(--verde)}
.foto{width:96px;height:96px;border-radius:30px;background:var(--verde2) center/cover no-repeat;display:grid;place-items:center;flex:none;color:var(--verde)}
.foto svg{width:56%;height:56%}

/* Filas */
.fila{display:flex;gap:14px;align-items:center;padding:13px 0;border-top:1px solid var(--line);cursor:pointer}
.fila:first-child{border-top:0}
.ico{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--verde2);color:var(--verde);flex:none}
.ico svg{width:24px;height:24px}
.ico.terra{background:var(--terra2)}
.txt{flex:1;min-width:0}
.t{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.txt .s{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pill{font-size:12px;padding:5px 10px;border-radius:999px;font-weight:800;white-space:nowrap;flex:none}
.pill.ok{background:var(--verde2);color:var(--verde)}
.pill.pronto{background:var(--ambar2);color:var(--ambar)}
.pill.vencido{background:var(--rojo2);color:var(--rojo)}
.pill.neutro{background:var(--bg);color:var(--muted)}
.vacio{text-align:center;color:var(--muted);padding:24px 12px;font-size:14.5px}
.vacio b{display:grid;place-items:center;width:60px;height:60px;margin:0 auto 10px;border-radius:20px;background:var(--verde2);color:var(--verde)}
.vacio b svg{width:30px;height:30px}

.seg{display:flex;gap:8px;overflow-x:auto;margin:6px -20px 14px;padding:4px 20px 10px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:0;background:var(--card);padding:10px 16px;border-radius:16px;font-size:14px;font-weight:700;color:var(--muted);box-shadow:var(--sombra)}
.seg button.on{background:var(--verde);color:var(--sobre);box-shadow:var(--sombra-btn)}

.datos{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;font-size:14.5px;padding:10px 0}
.datos dt{color:var(--muted)}.datos dd{margin:0;text-align:right;overflow-wrap:anywhere;font-weight:600}
.contacto{display:flex;gap:14px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.contacto:first-child{border-top:0}
.tel{border:0;background:var(--verde);color:var(--sobre);border-radius:14px;padding:9px 14px;font-weight:700;font-size:13.5px;text-decoration:none;flex:none;box-shadow:var(--sombra-btn)}

/* Cifra grande (peso) */
.grande{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}

/* Peso */
.grafica{width:100%;height:auto;display:block;margin-bottom:8px}
.grafica .area{fill:var(--verde2)}
.grafica .lin{fill:none;stroke:var(--verde);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.grafica .pt{fill:var(--card);stroke:var(--verde);stroke-width:2.2}
.grafica .rej{stroke:var(--line);stroke-width:1}
.grafica text{fill:var(--muted);font-size:10px;font-family:inherit}

/* Documentos */
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.doc{background:var(--card);border:0;border-radius:var(--r);overflow:hidden;text-align:left;padding:8px;box-shadow:var(--sombra)}
.doc .mini{aspect-ratio:4/3;background:var(--panel) center/cover no-repeat;display:grid;place-items:center;position:relative;border-radius:18px;color:var(--verde)}
.doc .mini svg{width:40px;height:40px}
.doc .mini.pdf{background:var(--verde2)}
.doc .nube{position:absolute;right:7px;top:7px;font-size:11px;background:var(--card);border-radius:8px;padding:2px 6px;color:var(--muted)}
.doc .pie{padding:8px 6px 4px}
.doc .t{font-size:14px;white-space:nowrap}
.doc .s{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ajustes-link{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:26px 0 6px;border:0;background:none;color:var(--muted);font-weight:700;font-size:14px;padding:10px}
.ajustes-link .estado{display:inline-block}
/* Barra inferior y botón + */
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:0 14px calc(10px + env(safe-area-inset-bottom));z-index:6;pointer-events:none}
nav.tabs .in{display:flex;width:100%;max-width:520px;background:var(--card);border-radius:26px;box-shadow:0 12px 34px rgba(38,46,52,.14);padding:8px;pointer-events:auto}
nav.tabs button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;flex:1;padding:6px 0;border-radius:18px}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button.on{color:var(--sobre);background:var(--verde)}
.fab{position:fixed;right:max(20px,calc(50vw - 360px));bottom:calc(98px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:20px;background:var(--verde);color:var(--sobre);border:2.5px solid var(--sobre);display:grid;place-items:center;box-shadow:var(--sombra-btn);z-index:6}
.fab svg{width:28px;height:28px}

/* Hoja de formulario */
.velo{position:fixed;inset:0;background:rgba(20,28,32,.40);z-index:20;display:none;align-items:flex-end;justify-content:center}
.velo.abierto{display:flex}
.hoja{background:var(--bg);width:100%;max-width:620px;max-height:92vh;max-height:92dvh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:30px 30px 0 0;padding:8px 20px calc(20px + env(safe-area-inset-bottom));animation:sube .26s cubic-bezier(.2,.8,.2,1)}
@keyframes sube{from{transform:translateY(40px);opacity:.4}}
@media (min-width:700px){.velo{align-items:center}.hoja{border-radius:30px;max-height:86vh}}
.asa{width:40px;height:5px;border-radius:3px;background:var(--panel);margin:4px auto 12px}
.hoja:focus{outline:none}
[role=button]:focus-visible,.fila:focus-visible{outline:2px solid var(--verde);outline-offset:2px;border-radius:12px}
.v2-foto{display:inline-flex;vertical-align:-2px;margin-left:6px;color:var(--muted)}.v2-foto svg{width:15px;height:15px}
.hoja-tit{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.hoja-tit h3{font-size:22px;flex:1}
.cerrar{border:0;background:var(--card);width:34px;height:34px;border-radius:50%;font-size:14px;color:var(--muted);box-shadow:var(--sombra)}
.subt{font-size:15px;font-weight:800;margin:24px 4px 0;color:var(--verde)}
label{display:block;font-size:12.5px;color:var(--muted);margin:12px 4px 6px;font-weight:700}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:16px;border:1.5px solid transparent;background:var(--card);color:var(--ink);outline:none;min-height:48px;box-shadow:0 4px 14px rgba(47,90,85,.06)}
input:focus,select:focus,textarea:focus{border-color:var(--verde)}
input[type=date]{-webkit-appearance:none;appearance:none;display:block}
textarea{min-height:84px;resize:vertical}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dos>.campo{min-width:0}
.btn{border:0;border-radius:18px;padding:15px 16px;font-weight:800;background:var(--verde);color:var(--sobre);width:100%;text-align:center;text-decoration:none;display:block;box-shadow:var(--sombra-btn)}
.btn.sec{background:var(--card);color:var(--verde);box-shadow:var(--sombra)}
.btn.peligro{background:none;color:var(--rojo);box-shadow:none}
.acciones{display:grid;gap:10px;margin-top:22px}
.rapido{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.rapido button{border:0;background:var(--card);border-radius:22px;padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:10px;font-weight:700;box-shadow:var(--sombra)}
.rapido button span{width:44px;height:44px;border-radius:14px;background:var(--verde2);color:var(--verde);display:grid;place-items:center}
.rapido button span svg{width:24px;height:24px}
.fotoedit{display:flex;align-items:center;gap:14px;margin:6px 0 2px}
.fotoedit .foto{width:76px;height:76px;border-radius:24px}
.nota{background:var(--card);border-radius:18px;padding:12px 14px;font-size:14px;color:var(--muted);margin-top:12px;box-shadow:var(--sombra)}
.adjuntos{margin-top:4px}

.estado-sync{border-radius:16px;padding:12px 14px;margin:12px 0 0;display:flex;flex-direction:column;gap:3px;font-size:14px;background:var(--card);box-shadow:var(--sombra)}
.estado-sync b{font-size:14.5px}.estado-sync span{color:var(--muted);line-height:1.4}
.estado-sync.bien{background:var(--verde2)}.estado-sync.bien b{color:var(--verde)}
.estado-sync.mal{background:var(--rojo2)}.estado-sync.mal b{color:var(--rojo)}.estado-sync.mal span{color:var(--ink)}
.anio-tit{display:flex;align-items:center;gap:10px;margin:20px 4px 10px;font-weight:800;font-size:15px;color:var(--verde)}
.anio-tit::after{content:"";flex:1;height:1px;background:var(--line)}
.pas-hoja{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:700px){.pas-hoja{grid-template-columns:1fr 1fr}}
.peg{position:relative;aspect-ratio:1.55;border-radius:10px;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.06),0 4px 10px rgba(0,0,0,.10);overflow:hidden;display:flex;flex-direction:column;color:#222;border:1px solid rgba(0,0,0,.06)}
.peg.foto{background:#fff center/cover no-repeat}
.peg-edit{display:flex;gap:14px;align-items:center;margin:6px 0 2px}
.peg-edit .peg{width:150px;flex:none}
.peg-edit .peg.vacia{display:grid;place-items:center;text-align:center;font-size:12.5px;font-weight:700;color:var(--muted);background:var(--card);border:1.5px dashed var(--panel);box-shadow:none}
.peg-edit-btns{display:grid;gap:8px;flex:1}
.peg-edit-btns .btn{padding:11px 12px;font-size:14.5px}
.f2-op select{position:absolute;inset:0;opacity:0;width:100%;font-size:16px;cursor:pointer}
/* Pasaporte: selector de año segmentado */
.f2{margin:-4px 0 16px}
.f2-seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:16px;padding:4px;box-shadow:var(--sombra)}
.f2-op{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:none;border-radius:12px;padding:10px;font-weight:800;font-size:15px;color:var(--muted)}
.f2-op svg{width:16px;height:16px}
.f2-op.on{background:var(--verde);color:var(--sobre)}

/* Salud: 4 pestañas fijas en 2 filas */
.seg.seg-fija{display:grid;grid-template-columns:1fr 1fr;gap:8px;overflow:visible;margin:6px 0 16px;padding:0}
.seg.seg-fija button{width:100%;padding:11px 8px;text-align:center}

/* Salud: parte superior (beige) */
.banda-top{margin:0 0 6px}
.banda-top .sec{margin:20px 4px 12px}
.banda-top .seg.seg-fija{margin:6px 0 4px}


/* Ficha (chapa sin medalla) */
.f1c{background:var(--card);border-radius:var(--r);box-shadow:var(--sombra);padding:18px 18px 16px;display:grid;gap:14px}
.f1c-tit h3{font-size:30px;line-height:1.05;letter-spacing:-.02em}
.f1c-tit span{display:block;color:var(--muted);font-size:17px;font-weight:700;margin-top:3px}
.f1c-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.f1c-grid span{display:block;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.f1c-grid b{display:block;font-size:14.5px;font-weight:800;overflow-wrap:anywhere}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-weight:600!important;letter-spacing:.02em}
.f1c-dueno{border-top:1.5px dashed var(--line);padding-top:12px;display:grid;gap:1px;font-size:14px;cursor:pointer}
.f1c-dueno .f1c-et{font-size:11px;font-weight:800;color:var(--verde);text-transform:uppercase;letter-spacing:.08em}
.f1c-dueno b{font-size:15px}
.f1c-dueno span{color:var(--muted)}

.pliegue-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;border:0;border-top:1px solid var(--line);background:none;color:var(--verde);font-weight:800;font-size:14px;padding:13px 0 8px;font-family:inherit}
.pliegue-btn svg{width:16px;height:16px;transition:transform .2s}
.pliegue.abierto .pliegue-btn svg{transform:rotate(180deg)}
.pliegue .fila:first-child{border-top:1px solid var(--line)}
.banda-top + .card{margin-top:22px}

/* Ficha oscura + QR */
.f1c.oscura{background:var(--banda);color:var(--banda-txt);box-shadow:0 14px 30px rgba(20,40,48,.22)}
.f1c-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.f1c.oscura .f1c-tit h3{color:var(--banda-txt)}
.f1c.oscura .f1c-tit span,.f1c.oscura .f1c-grid span{color:var(--banda-txt);opacity:.82}
.f1c.oscura .f1c-grid b{color:var(--banda-txt)}
.f1c.oscura .f1c-dueno{border-top-color:color-mix(in srgb,var(--banda-txt) 22%,transparent)}
.f1c.oscura .f1c-dueno .f1c-et{color:#9FD3C4}
.f1c.oscura .f1c-dueno b{color:var(--banda-txt)}
.f1c.oscura .f1c-dueno span{color:var(--banda-txt);opacity:.85}
.f1c-qr{flex:none;width:76px;height:76px;padding:0;border:0;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.f1c-qr svg{width:100%;height:100%;display:block}
.f1c-qr.vacio{background:none;border:1.5px dashed color-mix(in srgb,var(--banda-txt) 45%,transparent);color:var(--banda-txt);font-weight:800;font-size:13px;box-shadow:none}
.qr-grande{width:min(72vw,300px);margin:8px auto 0;border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
.qr-grande svg{display:block;width:100%;height:auto}
.cons-bloque span{display:block;font-size:11px;font-weight:800;color:var(--verde);text-transform:uppercase;letter-spacing:.07em;margin-bottom:2px}
.cons-bloque p{margin:0;font-size:14.5px;line-height:1.45;white-space:pre-wrap}
/* Peso ajustado a la pantalla */
#v-peso.activa{display:flex;flex-direction:column;overflow:hidden}
#v-peso .peso-graf{flex:1 1 auto;min-height:150px;display:flex;flex-direction:column;margin-bottom:0}
#v-peso .peso-graf .graf-caja{flex:1;min-height:0;margin-top:6px}
#v-peso .peso-graf .grafica{width:100%;height:100%;margin:0}
#v-peso .sec{flex:none;margin:16px 4px 10px}
#v-peso .peso-regs{flex:0 1 auto;min-height:0;overflow:auto;margin-bottom:0;-webkit-overflow-scrolling:touch}

.pb-fila{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;background:none;padding:10px 0;border-top:1px solid var(--line);text-align:left;color:var(--ink);font-family:inherit}
.peso-regs > :first-child,.pliegue > :first-child{border-top:0}
/* Peso: filas de registros */
.pb-kg{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.pb-kg span{font-size:15px;color:var(--muted);font-weight:700}
.pb-kg small{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
/* Consultas comunes */
.cd-chev{width:18px;height:18px;flex:none;color:var(--muted);transition:transform .2s}
.ab .cd-chev{transform:rotate(180deg)}
.cd-det{display:grid;gap:10px;padding:4px 0 2px}
.cd-acc{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--muted);font-weight:700;border-top:1px dashed var(--line);padding-top:10px}
.cd-acc span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd-acc button{border:0;background:var(--verde2);color:var(--verde);font-weight:800;font-size:13px;padding:7px 12px;border-radius:10px;font-family:inherit}
/* Consultas: acordeón */
.ca{padding:4px 16px}
.ca-it{border-top:1px solid var(--line)}.ca-it:first-child{border-top:0}
.ca-cab{width:100%;display:flex;align-items:center;gap:12px;border:0;background:none;padding:12px 0;text-align:left;color:var(--ink);font-family:inherit}
.ca-dia{width:46px;flex:none;text-align:center;border-radius:12px;background:var(--verde2);color:var(--verde);padding:5px 0}
.ca-dia b{display:block;font-size:19px;font-weight:800;line-height:1.05}.ca-dia span{font-size:9.5px;font-weight:800;letter-spacing:.05em}
.ca-txt{flex:1;min-width:0}.ca-txt b{display:block;font-size:15.5px;font-weight:800}
.ca-txt span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ca-cab em{font-style:normal;font-size:12.5px;font-weight:800;color:var(--muted)}
.ca-it.ab .cd-det{padding:0 0 14px 58px}

/* Fecha en chip suave */
.fu1{font-size:14px;font-weight:800;color:var(--verde);background:var(--verde2);padding:7px 12px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
/* Ficha de vacuna: billete */
.v2{display:flex;border:0;padding:0;text-align:left;background:var(--card);border-radius:20px;box-shadow:var(--sombra);overflow:hidden;color:var(--ink);font-family:inherit;width:100%;position:relative}
.v2-talon{width:44px;flex:none;background:var(--pc);color:var(--pf);display:flex;align-items:center;justify-content:center;position:relative}
.v2-talon span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.v2-talon::after{content:"";position:absolute;right:-1px;top:8px;bottom:8px;border-right:2px dashed var(--card)}
.v2::before,.v2::after{content:"";position:absolute;left:35px;width:18px;height:18px;border-radius:50%;background:var(--bg);z-index:1}
.v2::before{top:-9px}.v2::after{bottom:-9px}
.v2-cuerpo{flex:1;min-width:0;padding:12px 14px 11px 16px;display:grid;gap:8px}
.v2-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.v2-top b{font-size:16px;font-weight:800}
.v2-vuelo{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.v2-vuelo span{display:block;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.v2-vuelo b{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.v2-dcha{text-align:right}.v2-dcha b{color:var(--verde)}
.v2-linea{display:flex;align-items:center;gap:4px;color:var(--muted)}.v2-linea i{flex:1;border-top:1.5px dashed var(--line)}.v2-linea svg{width:16px;height:16px}
.v2-pie{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted);font-weight:700;border-top:1px solid var(--line);padding-top:7px}
/* Visor */
.visor{position:fixed;inset:0;background:#0c1110;z-index:30;display:none;flex-direction:column;color:#eee}
.visor.abierto{display:flex}
.visor .barra-v{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
.visor .barra-v b{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.visor .barra-v button,.visor .barra-v a{border:0;background:#24302e;color:#eee;border-radius:12px;padding:8px 12px;font-size:14px;text-decoration:none;flex:none}
.visor .cont{flex:1;display:grid;place-items:center;overflow:auto;min-height:0}
.visor img{max-width:100%;max-height:100%;object-fit:contain}
.visor iframe{width:100%;height:100%;border:0;background:#fff}
.visor .msg{color:#bbb;text-align:center;padding:30px;font-size:15px}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-80px);background:var(--verde);color:var(--sobre);padding:11px 18px;border-radius:16px;font-size:14.5px;font-weight:700;z-index:40;transition:transform .25s;max-width:90vw;text-align:center;box-shadow:var(--sombra-btn)}
.toast.ver{transform:translate(-50%,0)}

@media (min-width:820px){
  .hero-foto{height:352px}
}

/* ---------- Menú A: barra fija abajo, opaca, con + central ---------- */
body.menu-a{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
body.menu-a .fab{display:none}
body.menu-a nav.tabs{background:color-mix(in srgb,var(--card) 72%,transparent);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);border-top:1px solid var(--vidrio-borde);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left,0px));pointer-events:auto;box-shadow:0 -6px 20px rgba(38,46,52,.06)}
body.menu-a nav.tabs .in{background:none;box-shadow:none;border-radius:0;padding:0;align-items:center}
body.menu-a nav.tabs button{background:none;gap:3px;padding:6px 0;color:var(--muted)}
body.menu-a nav.tabs button svg{width:24px;height:24px;padding:3px 12px;box-sizing:content-box;border-radius:14px}
body.menu-a nav.tabs button.on{color:var(--verde);background:none}
body.menu-a nav.tabs button.on svg{background:var(--verde2)}
.mas-nav span{width:50px;height:50px;border-radius:17px;background:var(--verde);color:var(--sobre);display:grid;place-items:center;box-shadow:var(--sombra-btn)}
.mas-nav span svg{width:26px!important;height:26px!important;padding:0!important;background:none!important}

body.menu-a .mas-nav{display:flex}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  <button data-tab="salud" onclick="irA('salud')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.4-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.8-7.5 10.2-7.5 10.2z"/><path d="M12 10.5v5M9.5 13h5" stroke-linecap="round"/></svg>Salud</button>
  <button class="mas-nav" onclick="accionFab()" aria-label="Añadir"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></button>
  <button data-tab="peso" onclick="irA('peso')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><circle cx="12" cy="5.6" r="2.2"/><path d="M7.4 9h9.2l2.7 10.4a1.2 1.2 0 0 1-1.2 1.5H5.9a1.2 1.2 0 0 1-1.2-1.5z"/><text x="12" y="17.4" text-anchor="middle" font-size="6.4" font-weight="800" font-family="Nunito,sans-serif" fill="currentColor" stroke="none">kg</text></svg>Peso</button>
  <button data-tab="docs" onclick="irA('docs')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3.5 7a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>Documentos</button>

    for (const x of [...(a[c] || []), ...(b[c] || [])]) { const y = m.get(x.id); if (!y || (x.upd || 0) > (y.upd || 0)) m.set(x.id, x); }
    r[c] = [...m.values()];
  }
  return r;
}

const TIPOS = {
  vacuna: { n: 'Vacuna', ico: '💉', meses: 12 },

// Un registro sigue "pendiente" si tiene próxima fecha y no hay otro posterior con el mismo nombre
function pendiente(s, lista) {
  if (!s.proxima) return false;
  return !lista.some(o => o.id !== s.id && norm(o.nombre) === norm(s.nombre) && (o.fecha || '') > (s.fecha || ''));
}
function proximoCumple() {
  const n = D.perfil.nacimiento; if (!n) return null;
  const h = aFecha(hoy()), a = aFecha(n);
  let c = new Date(h.getFullYear(), a.getMonth(), a.getDate());
  if (c < h) c = new Date(h.getFullYear() + 1, a.getMonth(), a.getDate());
  return { fecha: deFecha(c), anios: c.getFullYear() - a.getFullYear() };
}
function avisos() {
  const L = vivos('salud');
  const r = L.filter(s => pendiente(s, L) && diasHasta(s.proxima) >= -60).map(s => ({ fecha: s.proxima, titulo: s.nombre || TIPOS[s.tipo]?.n, sub: TIPOS[s.tipo]?.n || '', ico: TIPOS[s.tipo]?.ico || '🩺', abrir: `formSalud(D.salud.find(x=>x.id==='${sid(s.id)}'))` }));
  const cu = proximoCumple();
  if (cu && diasHasta(cu.fecha) <= 45) r.push({ fecha: cu.fecha, titulo: `Cumple ${cu.anios} ${cu.anios === 1 ? 'año' : 'años'}`, sub: fmt(cu.fecha), ico: '🎂', terra: 1, abrir: 'editarPerfil()', cumple: 1 });
  return r.sort((a, b) => a.fecha.localeCompare(b.fecha));
}
function pillFecha(f) {
  const d = diasHasta(f);
  let cls = 'ok', t;
  if (d < 0) { cls = 'vencido'; t = d === -1 ? 'ayer' : `hace ${-d} días`; }
  else if (d === 0) { cls = 'vencido'; t = 'hoy'; }
  else if (d === 1) { cls = 'pronto'; t = 'mañana'; }
  else if (d <= 14) { cls = 'pronto'; t = `en ${d} días`; }
  else t = d <= 45 ? `en ${d} días` : fmtCorto(f) + (aFecha(f).getFullYear() !== new Date().getFullYear() ? ' ' + aFecha(f).getFullYear() : '');
  return `<span class="pill ${cls}">${t}</span>`;
}
function edad(n) {
  if (!n) return '';
  const a = aFecha(n), h = aFecha(hoy());
  let m = (h.getFullYear() - a.getFullYear()) * 12 + h.getMonth() - a.getMonth();
  if (h.getDate() < a.getDate()) m--;
  if (m < 0) return '';
  const y = Math.floor(m / 12), mm = m % 12;
  if (y === 0) return `${mm} ${mm === 1 ? 'mes' : 'meses'}`;
  return `${y} ${y === 1 ? 'año' : 'años'}` + (mm ? ` y ${mm} ${mm === 1 ? 'mes' : 'meses'}` : '');
}

const anios = n => { const e = edad(n); if (!e) return ''; return e.replace(/ y \d+ mes(es)?$/, ''); };

function grafica(ps, W = 340, H = 150) {
  if (ps.length < 2) return '';
  const pl = 32, pr = 12, pt = 12, pb = 24;
  const xs = ps.map(p => aFecha(p.fecha).getTime()), ys = ps.map(p => Number(p.kg));
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x1 === x0) x1 = x0 + 864e5;
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const m = Math.max(.4, (y1 - y0) * .2); y0 -= m; y1 += m;
  const X = t => pl + (t - x0) / (x1 - x0) * (W - pl - pr), Y = v => pt + (1 - (v - y0) / (y1 - y0)) * (H - pt - pb);
  const pts = ps.map((p, i) => [X(xs[i]), Y(ys[i])]);
  const lin = pts.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join('');
  const area = lin + `L${pts.at(-1)[0].toFixed(1)} ${H - pb}L${pts[0][0].toFixed(1)} ${H - pb}Z`;
  let rej = '';
  for (let i = 0; i < 3; i++) { const v = y0 + (y1 - y0) * (i + .5) / 3, y = Y(v); rej += `<line class="rej" x1="${pl}" x2="${W - pr}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text x="${pl - 6}" y="${(y + 3).toFixed(1)}" text-anchor="end">${num(Math.round(v * 10) / 10)}</text>`; }
  const pf = ps.length > 24 ? '' : pts.map(q => `<circle class="pt" cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="3.2"/>`).join('');
  return `<svg class="grafica" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del peso">${rej}<path class="area" d="${area}" opacity=".8"/><path class="lin" d="${lin}"/>${pf}<text x="${pl}" y="${H - 6}">${fmtCorto(ps[0].fecha)}</text><text x="${W - pr}" y="${H - 6}" text-anchor="end">${fmtCorto(ps.at(-1).fecha)}</text></svg>`;
}

function campo(c, val) {

  else {
    const tipo = c.t === 'number' ? 'text' : (c.t || 'text');
    const extra = c.t === 'number' ? 'inputmode="decimal"' : c.t === 'tel' ? 'inputmode="tel"' : '';
    inp = `<input id="${id}" name="${c.k}" type="${tipo}" ${extra} value="${esc(c.t === 'number' && val !== '' ? String(val).replace('.', ',') : val)}" placeholder="${esc(c.ph || '')}" ${c.list ? `list="dl_${c.k}"` : ''}>`;

function formulario(o) {
  const v = o.v || {};
  let h = `<div class="asa"></div><div class="hoja-tit"><h3>${esc(o.titulo)}</h3><button type="button" class="cerrar" onclick="intentarCerrar()" aria-label="Cerrar">✕</button></div>${o.html || ''}<form id="frm" autocomplete="off" novalidate>`;
  let buf = [];
  const flush = () => { if (buf.length) { h += buf.length === 2 ? `<div class="dos">${buf.join('')}</div>` : buf[0]; buf = []; } };
  for (const c of o.campos) {
    if (c.t === 'sep') { flush(); h += `<div class="subt">${esc(c.l)}</div>`; continue; }
    const html = campo(c, v[c.k]);
    if (c.half) { buf.push(html); if (buf.length === 2) flush(); } else { flush(); h += html; }
  }
  flush();
  h += `${o.htmlFin || ''}<div class="acciones"><button class="btn" type="submit">Guardar</button>${(o.extra || []).map((e, i) => `<button type="button" class="btn sec" data-extra="${i}">${esc(e.t)}</button>`).join('')}${o.borrar ? '<button type="button" class="btn peligro" data-borrar>Borrar</button>' : ''}</div></form>`;
  abrirHoja(h);
  const f = $('#frm');
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const r = {};
    for (const c of o.campos) {
      if (c.t === 'sep') continue;
      let x = f.elements[c.k].value.trim();
      if (c.t === 'number') x = leerNum(x);
      r[c.k] = x;
    }
    if (o.validar) { const err = o.validar(r); if (err) return toast(err); }
    const btn = f.querySelector('[type=submit]'); btn.disabled = true;
    try { if ((await o.guardar(r)) !== false) cerrarHoja(); } finally { btn.disabled = false; }
  });
  f.addEventListener('input', () => { hojaSucia = true; });
  f.addEventListener('change', () => { hojaSucia = true; });
  f.querySelectorAll('[data-extra]').forEach(b => b.onclick = () => o.extra[b.dataset.extra].fn(f));
  const bb = f.querySelector('[data-borrar]');
  if (bb) bb.onclick = () => { if (confirm('¿Borrar este registro?')) { o.borrar(); cerrarHoja(); } };
  if (o.alCambiar) { f.addEventListener('input', e => o.alCambiar(f, e.target.name)); f.addEventListener('change', e => o.alCambiar(f, e.target.name)); }
  if (o.iniciar) o.iniciar(f);
  return f;
}
// Para números con decimales (8,5 kg) en campos de texto
// Admite coma o punto decimal: «19,8», «19.8», «1.250,5», «45.50». Un punto con grupos de 3 cifras («1.250») es de miles.
const leerNum = s => {
  let t = String(s ?? '').trim().replace(/\s/g, '');
  if (!t) return '';
  if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
  const x = parseFloat(t); return Number.isNaN(x) ? '' : x;
};

function qrSVG(texto) {
  try {
    const q = qrcode(0, 'M'); q.addData(texto); q.make();
    const n = q.getModuleCount(); let d = '';
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (q.isDark(y, x)) d += `M${x} ${y}h1v1h-1z`;
    return `<svg viewBox="-2 -2 ${n + 4} ${n + 4}" shape-rendering="crispEdges" aria-hidden="true"><rect x="-2" y="-2" width="${n + 4}" height="${n + 4}" fill="#fff"/><path d="${d}" fill="#14323A"/></svg>`;
  } catch { return ''; }
}

/* Tratamiento de una consulta -> medicación (automático) */
function medDeTratamiento(c) {
  const t = (c.tratamiento || '').trim(); if (!t) return null;
  let dias = 0, mm;
  const NUM = { un: 1, una: 1, dos: 2, tres: 3, cuatro: 4, cinco: 5, seis: 6, siete: 7, ocho: 8, nueve: 9, diez: 10, quince: 15, veinte: 20, treinta: 30 };
  const sinCada = t.replace(/cada\s+\d+\s*(h|horas?|d[ií]as?|semanas?)\b/gi, ' ').replace(/\b(un|una|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|quince|veinte|treinta)\s+(d[ií]as?|semanas?|mes(es)?)\b/gi, (m0, n, u) => NUM[n.toLowerCase()] + ' ' + u);
  if ((mm = sinCada.match(/durante\s+(\d+)\s*d[ií]as?/i) || sinCada.match(/(\d+)\s*d[ií]as?/i))) dias = +mm[1];
  else if ((mm = sinCada.match(/(\d+)\s*semanas?/i))) dias = +mm[1] * 7;
  else if ((mm = sinCada.match(/(\d+)\s*mes(es)?/i))) dias = +mm[1] * 30;
  const frec = (t.match(/cada\s+\d+\s*(h|horas?)\b/i) || t.match(/cada\s+\d+\s*d[ií]as?\b/i) || [''])[0];
  const dosis = (t.match(/\d+(?:[.,]\d+)?\s*(ml|mg|gotas?|comprimidos?|pastillas?|cápsulas?)\b/i) || [''])[0];
  const comunes = /^(Reposo|Limpiar|Limpieza|Revisión|Revision|Paseos?|Dieta|Evitar|Volver|Control|Tratamiento|Aplicar|Dar|Cada|Durante|Con|Sin|Pienso|Antibiótico|Antibiotico|Antiinflamatorio|Analgésico|Analgesico|Pomada|Crema|Gotas|Pastillas?|Comprimidos?|Cápsulas?|Jarabe|Champú|Champu|Colirio|Spray|Inyección|Vacuna|Collar|Pipeta|Oído|Oreja|Ojos?|Herida|Correa|Comida|Agua|Baños?|Cura|Curas|Vendaje|Ayuno|Luego|Después|Despues|Mañana|Noche|Semana|Días?)$/i;
  const nombres = [...t.matchAll(/\b([A-ZÁÉÍÓÚ][a-záéíóúñ]{3,}(?:\s+(?:Plus|Forte|Retard))?)\b/g)].map(x => x[1]).filter(w => !comunes.test(w));
  return {
    id: 'med-' + c.id, consulta: c.id, auto: true,
    nombre: nombres[0] || `Tratamiento · ${c.motivo || 'consulta'}`,
    dosis, frecuencia: frec, inicio: c.fecha || hoy(), fin: dias ? sumarDias(c.fecha || hoy(), dias - 1) : (c.fecha && diasHasta(c.fecha) < -14 ? c.fecha : ''),
    motivo: c.motivo || '', notas: t,
  };
}
function aplicarTratamiento(c, avisar) {
  const nueva = medDeTratamiento(c), i = D.medicacion.findIndex(x => x.id === 'med-' + c.id);
  const actual = i >= 0 ? D.medicacion[i] : null;
  if (!nueva) return;
  if (actual && (actual.borrado || actual.auto === false)) return; // borrada o editada a mano: no tocar

  if (avisar) toast(actual ? 'Medicación actualizada' : 'Tratamiento añadido a Medicación');
}

/* ---------- documentos y archivos ---------- */
const idb = (() => {
  let p;
  const abrir = () => p || (p = new Promise((ok, ko) => { const r = indexedDB.open('mi-mascota', 1); r.onupgradeneeded = () => r.result.createObjectStore('archivos'); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); }));
  const tx = async (modo, fn) => { const db = await abrir(); return new Promise((ok, ko) => { const t = db.transaction('archivos', modo); const q = fn(t.objectStore('archivos')); t.oncomplete = () => ok(q && q.result); t.onerror = () => ko(t.error); }); };
  return { get: k => tx('readonly', s => s.get(k)), set: (k, v) => tx('readwrite', s => s.put(v, k)), del: k => tx('readwrite', s => s.delete(k)) };
})();
async function cargarImagen(file) {
  const url = URL.createObjectURL(file);
  try { const img = new Image(); img.src = url; await img.decode(); return img; }
  finally { setTimeout(() => URL.revokeObjectURL(url), 2000); }
}
function lienzo(img, max) {
  const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height); return c;
}
const aBlob = (c, q) => new Promise(r => c.toBlob(r, 'image/jpeg', q));
const blobA64 = b => new Promise((ok, ko) => { const fr = new FileReader(); fr.onload = () => ok(fr.result.split(',')[1]); fr.onerror = ko; fr.readAsDataURL(b); });
const a64Blob = (s, mime) => { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type: mime }); };

/* Fotos (perfil y pegatinas): se guardan en IndexedDB y en Drive; en los datos solo va la referencia «img:<id>» */
const IMG = {}, IMG_CARGANDO = {};
let descargasActivas = 0; const colaDescargas = [];
function enCola(fn) { return new Promise(ok => { colaDescargas.push(async () => { try { ok(await fn()); } finally { descargasActivas--; siguienteDescarga(); } }); siguienteDescarga(); }); }
function siguienteDescarga() { while (descargasActivas < 3 && colaDescargas.length) { descargasActivas++; colaDescargas.shift()(); } }
function imgURL(ref, driveId) {
  if (!ref) return '';
  if (ref.startsWith('data:')) return ref;
  if (!ref.startsWith('img:')) return '';
  const id = ref.slice(4);
  if (IMG[id]) return IMG[id];
  if (!IMG_CARGANDO[id]) {
    IMG_CARGANDO[id] = (async () => {
      let b = await idb.get('img-' + id).catch(() => null);
      if (!b && driveId && CFG.url) { try { const r = await enCola(() => api('bajarDoc', { driveId })); b = a64Blob(r.base64, r.mime || 'image/jpeg'); await idb.set('img-' + id, b); } catch { } }
      if (b) { IMG[id] = URL.createObjectURL(b); programarRender(); } else delete IMG_CARGANDO[id];
    })();
  }
  return '';
}
async function guardarImagen(canvas, q) {
  const b = await aBlob(canvas, q), id = uid();
  await idb.set('img-' + id, b);
  IMG[id] = URL.createObjectURL(b);
  return 'img:' + id;
}
// Varias imágenes que llegan seguidas → un solo repintado
let renderT = null; function programarRender() { clearTimeout(renderT); renderT = setTimeout(render, 60); }
async function dataABlob(u) { return (await fetch(u)).blob(); }
// Paso único: fotos antiguas guardadas dentro de los datos → IndexedDB
async function migrarFotos() {
  let hay = false;
  if ((D.perfil.foto || '').startsWith('data:')) {
    const b = await dataABlob(D.perfil.foto), id = uid(); await idb.set('img-' + id, b); IMG[id] = URL.createObjectURL(b);
    const t = { ...(D.perfil._t || {}) }, ahora = Date.now(); t.foto = t.fotoDrive = ahora;
    D.perfil = { ...D.perfil, foto: 'img:' + id, fotoDrive: '', upd: ahora, _t: t }; hay = true;
  }
  for (let i = 0; i < D.salud.length; i++) {
    const v = D.salud[i];
    if ((v.fotoPeg || '').startsWith('data:')) {
      const b = await dataABlob(v.fotoPeg), id = uid(); await idb.set('img-' + id, b); IMG[id] = URL.createObjectURL(b);
      D.salud[i] = { ...v, fotoPeg: 'img:' + id, fotoPegDrive: '', upd: Date.now() }; hay = true;
    }
  }
  for (let i = 0; i < D.docs.length; i++) {
    const d = D.docs[i];
    if ((d.thumb || '').startsWith('data:')) {
      const b = await dataABlob(d.thumb), id = uid(); await idb.set('img-' + id, b); IMG[id] = URL.createObjectURL(b);
      D.docs[i] = { ...d, thumb: 'img:' + id, thumbDrive: '', upd: Date.now() }; hay = true;
    }
  }
  if (hay) cambio();
}
// Devuelve cuántas imágenes no se pudieron subir (se reintentan en la siguiente sincronización)
async function subirImagenes() {
  let fallos = 0;
  const subir = async (ref, nombre) => {
    const b = await idb.get('img-' + ref.slice(4)).catch(() => null); if (!b) return null;
    try { return await api('subirDoc', { nombre, mime: 'image/jpeg', base64: await blobA64(b), carpeta: 'Fotos' }); }
    catch (e) { if (/contraseña|intentos|dirección|contactar|conexión|tardado/i.test(e.message)) throw e; fallos++; return null; }
  };
  const p = D.perfil;
  if ((p.foto || '').startsWith('img:') && !p.fotoDrive) {
    const r = await subir(p.foto, `Foto ${p.nombre || 'perro'}.jpg`);
    if (r && D.perfil.foto === p.foto) { const t = { ...(D.perfil._t || {}) }; t.fotoDrive = Date.now(); D.perfil = { ...D.perfil, fotoDrive: r.driveId, upd: Date.now(), _t: t }; marcarPendiente(); guardarLocal(); }
  }
  for (const v of D.salud.filter(x => !x.borrado && (x.fotoPeg || '').startsWith('img:') && !x.fotoPegDrive)) {
    const r = await subir(v.fotoPeg, `Pegatina ${v.nombre || ''} ${v.fecha || ''}.jpg`);
    const i = D.salud.findIndex(x => x.id === v.id);
    if (r && i >= 0 && D.salud[i].fotoPeg === v.fotoPeg) { D.salud[i] = { ...D.salud[i], fotoPegDrive: r.driveId, upd: Date.now() }; marcarPendiente(); guardarLocal(); }
  }
  for (const d of D.docs.filter(x => !x.borrado && (x.thumb || '').startsWith('img:') && !x.thumbDrive)) {
    const r = await subir(d.thumb, `Miniatura ${d.nombre || 'documento'}.jpg`);
    const i = D.docs.findIndex(x => x.id === d.id);
    if (r && i >= 0 && D.docs[i].thumb === d.thumb) { D.docs[i] = { ...D.docs[i], thumbDrive: r.driveId, upd: Date.now() }; marcarPendiente(); guardarLocal(); }
  }
  return fallos;
}

async function prepararArchivo(file) {
  const id = uid();
  let blob = file, mime = file.type || (/\.pdf$/i.test(file.name) ? 'application/pdf' : 'application/octet-stream'), thumb = '';
  if (mime.startsWith('image/')) {
    const img = await cargarImagen(file);
    blob = await aBlob(lienzo(img, 2000), .85); mime = 'image/jpeg';
    thumb = await guardarImagen(lienzo(img, 360), .7);
  }
  if (blob.size > 25e6) throw new Error('grande');
  await idb.set(id, blob);
  return { id, mime, tam: blob.size, thumb, localKey: id };
}

      }
      cambio(); if (n) toast(n === 1 ? 'Documento guardado' : `${n} documentos guardados`);
      volver();
    },
    borrar: nuevo ? null : () => { borrarItem('docs', d.id); idb.del(d.id).catch(() => { }); cerrarVisor(); },
  });
}

let urlVisor = null;

  const d = D.docs.find(x => x.id === id); if (!d) return;

  const barra = $('#visor-barra'), cont = $('#visor-cont');

  $('#visor').classList.add('abierto');
  let b = await idb.get(d.id).catch(() => null);
  if (!b && d.driveId && CFG.url) {
    try { const r = await api('bajarDoc', { driveId: d.driveId }); b = a64Blob(r.base64, r.mime || d.mime); await idb.set(d.id, b); }
    catch (e) { }
  }
  if (!$('#visor').classList.contains('abierto')) return;
  if (!b) { cont.innerHTML = `<div class="msg">Este documento no está en este dispositivo${CFG.url ? ' y no se pudo descargar ahora.' : '.<br>Configura la sincronización en Ajustes para verlo en todos tus dispositivos.'}${d.url ? `<br><br><a href="${esc(d.url)}" target="_blank" rel="noopener" style="color:#8DC2AB">Abrir en Google Drive</a>` : ''}</div>`; return; }
  if (urlVisor) URL.revokeObjectURL(urlVisor);
  urlVisor = URL.createObjectURL(b);
  cont.innerHTML = (d.mime || b.type || '').startsWith('image/') ? `<img src="${urlVisor}" alt="">` : `<iframe src="${urlVisor}" title="${esc(d.nombre)}"></iframe>`;
  const archivo = new File([b], (d.nombre || 'documento') + ext(d.mime || b.type), { type: d.mime || b.type });
  const btns = [];
  if (navigator.canShare && navigator.canShare({ files: [archivo] })) btns.push(`<button id="vshare">Compartir</button>`);
  else btns.push(`<a href="${urlVisor}" download="${esc(archivo.name)}">Descargar</a>`);
  if (d.url) btns.push(`<a href="${esc(d.url)}" target="_blank" rel="noopener">Drive</a>`);
  barra.insertAdjacentHTML('beforeend', btns.join(''));
  const sh = $('#vshare'); if (sh) sh.onclick = () => navigator.share({ files: [archivo], title: d.nombre }).catch(() => { });
}
function verImagen(url, titulo) {

function cerrarVisor() { $('#visor').classList.remove('abierto'); $('#visor-cont').innerHTML = ''; if (urlVisor) { URL.revokeObjectURL(urlVisor); urlVisor = null; } recargaPendiente(); }

/* ---------- sincronización con Google (Apps Script) ---------- */
let syncTimer = null, sincronizando = false, otraVez = false;
let estadoActual = '';
function estado(e) { estadoActual = e || ''; $('#estado').className = 'estado ' + estadoActual; pintarEstado(); }
function pintarEstado() { const el = $('#estado-txt'); if (el) el.className = 'estado ' + estadoActual; }
function programarSync(ms = 1500) { clearTimeout(syncTimer); if (CFG.url) syncTimer = setTimeout(() => sincronizar(), ms); }
async function api(accion, extra = {}) {
  let r;
  const ctl = new AbortController(), limite = window.MM_LIMITE_MS || (accion === 'subirDoc' || accion === 'bajarDoc' ? 120000 : 45000);
  const t = setTimeout(() => ctl.abort(), limite);
  try { r = await fetch(CFG.url, { method: 'POST', body: JSON.stringify({ clave: CFG.clave, accion, ...extra }), signal: ctl.signal }); }
  catch (e) {
    if (e.name === 'AbortError') throw new Error('Google ha tardado demasiado en responder. Se reintentará sola.');
    throw new Error(navigator.onLine ? 'No se puede contactar con el script. Revisa que la dirección esté bien copiada y termine en /exec.' : 'Sin conexión a internet.');
  }
  finally { clearTimeout(t); }
  if (r.status === 404) throw new Error('La dirección del script no existe. Copia de nuevo la URL de la implementación (termina en /exec).');
  if (!r.ok) throw new Error('El script respondió con un error (' + r.status + ').');
  let j;
  try { j = await r.json(); }
  catch { throw new Error('Google pide iniciar sesión. En «Implementar», el acceso debe ser «Cualquier usuario» (no «con cuenta de Google»).'); }
  if (j.error && /lock|timeout|tiempo de espera/i.test(j.error)) throw new Error('Google estaba guardando desde otro dispositivo. Se reintentará sola.');
  if (j.error && /service|exception|exceeded|quota|cuota|límite|limit|drive|calendar/i.test(j.error) && !/contraseña|intentos/i.test(j.error)) throw new Error('Google no ha podido completar la operación ahora mismo (' + j.error.replace(/^Exception:\s*/, '').slice(0, 80) + '). Se reintentará sola.');
  if (j.error) throw new Error(j.error === 'Contraseña incorrecta' ? 'Contraseña incorrecta: debe ser la misma que pusiste en CLAVE dentro del script.' : /intentos/i.test(j.error) ? 'Demasiados intentos con contraseña incorrecta. Espera 10 minutos y revisa la contraseña.' : j.error);
  return j;
}
async function sincronizar(manual) {
  if (!CFG.url) { estado(''); if (manual) toast('Configura primero la dirección del script'); return; }
  if (!navigator.onLine) { estado('error'); return; }
  // Si la contraseña falló, no reintentar solo (evita bloquear el script) hasta que se cambie en Ajustes
  let claveMala = false; try { claveMala = localStorage.getItem('mm-clave-mala') === '1'; } catch { }
  if (claveMala && !manual) { estado('error'); return; }
  if (sincronizando) { otraVez = true; return; }
  sincronizando = true; estado('sync');
  try {
    // Cada archivo por separado: si uno falla, se avisa y el resto de los datos se sincroniza igual
    let fallos = await subirImagenes(), ultimoFallo = '';
    for (const d of D.docs.filter(x => !x.borrado && !x.driveId)) {
      const b = await idb.get(d.id).catch(() => null); if (!b) continue;
      let r;
      try { r = await api('subirDoc', { nombre: `${d.fecha || hoy()} ${d.nombre || 'documento'}${ext(d.mime)}`, mime: d.mime, base64: await blobA64(b) }); }
      catch (e) { if (/contraseña|intentos|dirección|contactar|conexión|tardado/i.test(e.message)) throw e; fallos++; ultimoFallo = d.nombre || 'documento'; continue; }
      const i = D.docs.findIndex(x => x.id === d.id);
      if (i >= 0 && !D.docs[i].borrado) { D.docs[i] = { ...D.docs[i], driveId: r.driveId, url: r.url, upd: Date.now() }; marcarPendiente(); guardarLocal(); }
    }
    try { if (fallos) localStorage.setItem('mm-aviso-docs', fallos === 1 && ultimoFallo ? `«${ultimoFallo}» no se ha podido subir a Drive; se reintentará.` : `${fallos} archivos no se han podido subir a Drive; se reintentará.`); else localStorage.removeItem('mm-aviso-docs'); } catch { }
    // Con cambios pendientes se envía todo; si no, solo se leen los datos (más rápido y sin reescribir Drive ni el calendario)
    let pendiente = manual; try { pendiente = pendiente || localStorage.getItem('mm-pendiente') === '1'; } catch { pendiente = true; }
    const n0 = nCambios;
    // «ver» = versión de los datos en Drive: si no ha cambiado, el script no los vuelve a enviar
    let ver = ''; try { ver = localStorage.getItem('mm-ver') || ''; } catch { }
    const r = pendiente ? await api('sincronizar', { datos: D }) : await api('cargar', { ver });
    if (!r.sinCambios) {
      const antes = JSON.stringify(D);
      D = Object.assign(vacio(), fusionar(D, r.datos));
      if (pendiente && nCambios === n0) { try { localStorage.removeItem('mm-pendiente'); } catch { } }
      const guardado = guardarLocal();
      try { if (r.ver && guardado) localStorage.setItem('mm-ver', r.ver); else localStorage.removeItem('mm-ver'); } catch { }
      if (r.calendario) localStorage.setItem('mm-aviso-cal', r.calendario); else localStorage.removeItem('mm-aviso-cal');
      if (manual || JSON.stringify(D) !== antes) render();
    }
    localStorage.setItem('mm-ultima', Date.now()); localStorage.removeItem('mm-error');
    estado('ok');
    if (manual) toast('Sincronizado');
  } catch (e) {
    estado('error');
    try { localStorage.setItem('mm-error', navigator.onLine ? e.message : 'Sin conexión a internet.'); if (/contraseña|intentos/i.test(e.message)) localStorage.setItem('mm-clave-mala', '1'); } catch { }
    if (manual) toast('No se pudo sincronizar');
  } finally {
    sincronizando = false;
    if (otraVez) { otraVez = false; programarSync(500); }
  }
}

function htmlEstadoSync() {
  const ult = Number(localStorage.getItem('mm-ultima') || 0), err = localStorage.getItem('mm-error'), cal = localStorage.getItem('mm-aviso-cal');
  const cuando = ult ? new Date(ult).toLocaleString('es-ES', { dateStyle: 'medium', timeStyle: 'short' }) : '';
  let cls = 'neutro', tit, txt = '';
  if (!CFG.url) { tit = 'Sin configurar'; txt = 'Los datos solo están en este dispositivo.'; }
  else if (err) { cls = 'mal'; tit = 'No se pudo sincronizar'; txt = err + (cuando ? `<br>Última vez que funcionó: ${cuando}.` : ''); }
  else if (ult) { const avDocs = localStorage.getItem('mm-aviso-docs'); cls = 'bien'; tit = 'Sincronización funcionando'; txt = `Última vez: ${cuando}.` + (avDocs ? `<br>${esc(avDocs)}` : '') + (cal ? `<br>Pero los avisos del calendario fallan: ${esc(cal)}. Ejecuta «autorizar» otra vez en el script.` : ''); }
  else { tit = 'Aún no se ha sincronizado'; txt = 'Pulsa «Guardar y sincronizar».'; }
  return `<div class="estado-sync ${cls}" id="estadoSync"><b>${tit}</b><span>${txt}</span></div>`;
}
function abrirAjustes() {
  const ult = Number(localStorage.getItem('mm-ultima') || 0);
  abrirHoja(`<div class="asa"></div><div class="hoja-tit"><h3>Ajustes</h3><button class="cerrar" onclick="cerrarHoja()" aria-label="Cerrar">✕</button></div>
  <div class="subt">Sincronizar con Google</div>
  <label for="cfgUrl">Dirección del script (termina en /exec)</label><input id="cfgUrl" value="${esc(CFG.url || '')}" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocorrect="off" spellcheck="false">
  <label for="cfgClave">Contraseña de la app</label><input id="cfgClave" type="password" value="${esc(CFG.clave || '')}" autocapitalize="off" autocorrect="off">
  ${htmlEstadoSync()}
  <div class="acciones" style="margin-top:10px"><button class="btn" onclick="guardarAjustes()">Guardar y sincronizar</button></div>
  <div class="nota">Con la sincronización activa, los datos se guardan en tu Google Drive (carpeta «Mi Mascota»), los documentos se suben a «Mi Mascota/Documentos» y los avisos se crean en un calendario «Mi Mascota».</div>
  <div class="subt">Copia de seguridad</div>
  <div class="acciones" style="margin-top:10px"><button class="btn sec" onclick="exportar()">Descargar copia (sin archivos)</button><button class="btn sec" onclick="$('#fimp').click()">Importar una copia</button></div>
  <div class="s" style="margin:6px 2px 0">Importar combina la copia con lo que ya tienes: añade lo que falte y no deshace los cambios hechos después.</div>
  <input type="file" id="fimp" accept="application/json,.json" hidden>
  <div class="s" style="text-align:center;margin-top:22px">Mi Mascota · ${VERSION}</div>`);
  $('#fimp').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const x = JSON.parse(await f.text()); D = Object.assign(vacio(), fusionar(D, x.datos || x)); cambio(); toast('Copia importada'); cerrarHoja(); }
    catch { toast('Ese archivo no es una copia válida'); }
  };
}
async function guardarAjustes() {
  CFG = { url: $('#cfgUrl').value.trim(), clave: $('#cfgClave').value };
  localStorage.setItem('mm-cfg', JSON.stringify(CFG));
  localStorage.removeItem('mm-error'); localStorage.removeItem('mm-clave-mala'); localStorage.removeItem('mm-ver');
  render();
  const el = $('#estadoSync');
  if (!CFG.url) { estado(''); if (el) el.outerHTML = htmlEstadoSync(); return; }
  if (el) el.outerHTML = '<div class="estado-sync" id="estadoSync"><b>Comprobando…</b><span>Conectando con tu Google.</span></div>';
  await sincronizar(true);
  const el2 = $('#estadoSync'); if (el2) el2.outerHTML = htmlEstadoSync();
}
function exportar() {
  const b = new Blob([JSON.stringify({ app: 'Mi Mascota', version: VERSION, fecha: new Date().toISOString(), datos: D }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `mi-mascota-copia-${hoy()}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

/* Versión nueva: se recarga sola, pero nunca con un formulario o un documento abierto */
let hayVersionNueva = false, recargando = false;
function recargaPendiente() {
  if (!hayVersionNueva || recargando) return;
  if ($('#velo').classList.contains('abierto') || $('#visor').classList.contains('abierto')) return;
  recargando = true; location.reload();
}

/* ---------- arranque ---------- */
document.body.classList.add('menu-a');
pintarTema();
render();
migrarFotos().catch(() => { });
if (CFG.url) sincronizar();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { render(); sincronizar(); } });
setInterval(() => { if (document.visibilityState === 'visible' && CFG.url) sincronizar(); }, 30000);
addEventListener('online', () => sincronizar());
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  // Si hay una versión nueva, se instala y la app se recarga sola una vez
  const habiaControl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (habiaControl) { hayVersionNueva = true; recargaPendiente(); } });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    reg.update().catch(() => { });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => { }); });
  }).catch(() => { });
}
