<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" id="metaTema" content="#F3EDE2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Mascota">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Mi Mascota</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Estilo «tarjetas flotantes»: fondo verde-gris frío, tarjetas blancas con sombra difusa, verde azulado como único color de marca */
:root{
  /* Crema + azul petróleo oscuro; arena como tono de apoyo (pelo canela, sin marrones) */
  --bg:#F3EDE2;--card:#FFFCF6;--ink:#1D2B33;--muted:#87857C;--line:#ECE4D6;
  --verde:#1F4B57;--verde2:#E9E1D2;--verde3:#2C6170;--terra:#1F4B57;--terra2:#EFE7DA;
  --ambar:#A9741C;--ambar2:#F8EDD6;--rojo:#B84535;--rojo2:#F8E2DC;
  --panel:#E0D3BD;--sobre:#FFFCF6;--vidrio:rgba(255,251,244,.58);--vidrio-borde:rgba(255,255,255,.55);--banda:#1F4B57;--banda-txt:#F6F0E6;
  --sombra:0 14px 34px rgba(38,46,52,.09),0 2px 6px rgba(38,46,52,.05);
  --sombra-btn:0 10px 22px rgba(31,75,87,.30);
  --r:24px;
  --f:'Nunito','Avenir Next',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#13191C;--card:#1C2428;--ink:#EDE8DE;--muted:#9A9A92;--line:#2A3337;
  --verde:#8FC3CF;--verde2:#25323A;--verde3:#6FAAB8;--terra:#8FC3CF;--terra2:#25323A;
  --ambar:#E6BA68;--ambar2:#352C1A;--rojo:#F08A7A;--rojo2:#3A2421;
  --panel:#2B3236;--sobre:#10232A;--vidrio:rgba(28,36,40,.55);--vidrio-borde:rgba(255,255,255,.10);--banda:#0C1416;--banda-txt:#EDE8DE;
  --sombra:0 10px 28px rgba(0,0,0,.35);--sombra-btn:0 8px 20px rgba(0,0,0,.4);
  color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f);-webkit-text-size-adjust:100%}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3,.serif{font-family:var(--f);font-weight:800;letter-spacing:-.01em;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--verde)}
.ic{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.2em;flex:none}

header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);color:var(--ink);padding:calc(env(safe-area-inset-top) + 12px) 20px 10px;display:flex;align-items:center;gap:12px;max-width:760px;margin:0 auto}
header.top h1{font-size:24px;flex:1;text-align:center;color:inherit}
header.top{max-width:none;margin:0}
.estado{width:10px;height:10px;border-radius:50%;background:var(--muted);opacity:.35;flex:none;border:0;padding:0}
header.top h1 .estado{display:inline-block;vertical-align:middle;margin:0 0 0 8px;width:11px;height:11px;position:relative;top:-2px}
header.top h1 .estado::after{content:"";position:absolute;inset:-12px}
.estado.ok{box-shadow:0 0 0 3px color-mix(in srgb,var(--verde) 22%,transparent)}
.estado.ok{background:#2E9E6A;opacity:1}
.estado.sync{background:var(--ambar);opacity:1;animation:lat 1s infinite}
.estado.error{background:var(--rojo);opacity:1}
@keyframes lat{50%{opacity:.25}}
.menu-btn{border:0;background:none;width:40px;height:40px;display:grid;place-items:center;color:var(--ink);flex:none}
.menu-btn svg{width:24px;height:24px}
.icon-btn{border:0;background:var(--card);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;box-shadow:var(--sombra);flex:none;overflow:hidden;padding:0;color:var(--verde)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.avatar{background:var(--verde2) center/cover no-repeat}

main{max-width:760px;margin:0 auto;padding:4px 20px 24px}
.vista{display:none}.vista.activa{display:block;animation:entra .25s ease}
@keyframes entra{from{opacity:0;transform:translateY(8px)}}
.card{background:var(--card);border-radius:var(--r);padding:8px 18px;box-shadow:var(--sombra);margin-bottom:14px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 4px 12px}
.sec h2{font-size:18px}
.link{border:0;background:none;color:var(--verde);font-weight:700;font-size:14px;padding:4px 0}
.s{color:var(--muted);font-size:13.5px}

/* Ficha estilo «perfil de adopción» */
.hero{position:relative;margin:-4px -20px 0;cursor:pointer}
.hero-foto{height:min(94vw,376px);border-radius:0 0 34px 34px;background:var(--panel) center 35%/cover no-repeat;display:grid;place-items:center;color:color-mix(in srgb,var(--verde) 55%,var(--panel));overflow:hidden;position:relative}
.hero-foto .silueta{width:130px;height:130px;margin-top:-80px}
.hero-foto .puntos{position:absolute;bottom:74px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
.hero-foto .puntos i{width:6px;height:6px;border-radius:3px;background:#fff;opacity:.6}.hero-foto .puntos i:first-child{width:16px;background:var(--verde);opacity:1}
.hero-card{position:absolute;left:16px;right:16px;bottom:16px;background:var(--vidrio);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--vidrio-borde);border-radius:var(--r);box-shadow:0 10px 30px rgba(20,30,36,.18);padding:16px 20px}
.hc-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hc-top h2{font-size:26px}
.sexo{color:var(--verde);display:grid;place-items:center}.sexo svg{width:24px;height:24px}
.hc-sub{color:var(--ink);font-size:15px;margin-top:2px;font-weight:700;overflow-wrap:anywhere}
.hc-sub span:last-child{color:var(--ink);opacity:.7;font-weight:600}
.hc-loc{display:flex;gap:6px 16px;flex-wrap:wrap;font-variant-numeric:tabular-nums;color:var(--ink);opacity:.8;font-size:13.5px;margin-top:8px}
.hc-loc span{display:flex;align-items:center;gap:5px}.hc-loc .ic{color:var(--verde)}
.foto{width:96px;height:96px;border-radius:30px;background:var(--verde2) center/cover no-repeat;display:grid;place-items:center;flex:none;color:var(--verde)}
.foto svg{width:56%;height:56%}

/* Categorías como en el buscador */
.cats{display:flex;gap:12px;overflow-x:auto;margin:16px -20px 0;padding:6px 20px 10px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);font-weight:600;flex:none;padding:0}
.cat i{width:58px;height:58px;border-radius:18px;background:var(--card);box-shadow:var(--sombra);display:grid;place-items:center;color:var(--verde)}
.cat i svg{width:28px;height:28px}
.cat.on i{background:var(--verde);color:var(--sobre);box-shadow:var(--sombra-btn)}
.cat.on{color:var(--ink)}

/* Filas */
.fila{display:flex;gap:14px;align-items:center;padding:13px 0;border-top:1px solid var(--line);cursor:pointer}
.fila:first-child{border-top:0}
.ico{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--verde2);color:var(--verde);flex:none}
.ico svg{width:24px;height:24px}
.ico.terra{background:var(--terra2)}
.txt{flex:1;min-width:0}
.t{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.txt .s{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pill{font-size:12px;padding:5px 10px;border-radius:999px;font-weight:800;white-space:nowrap;flex:none}
.pill.ok{background:var(--verde2);color:var(--verde)}
.pill.pronto{background:var(--ambar2);color:var(--ambar)}
.pill.vencido{background:var(--rojo2);color:var(--rojo)}
.pill.neutro{background:var(--bg);color:var(--muted)}
.vacio{text-align:center;color:var(--muted);padding:24px 12px;font-size:14.5px}
.vacio b{display:grid;place-items:center;width:60px;height:60px;margin:0 auto 10px;border-radius:20px;background:var(--verde2);color:var(--verde)}
.vacio b svg{width:30px;height:30px}

.seg{display:flex;gap:8px;overflow-x:auto;margin:6px -20px 14px;padding:4px 20px 10px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:0;background:var(--card);padding:10px 16px;border-radius:16px;font-size:14px;font-weight:700;color:var(--muted);box-shadow:var(--sombra)}
.seg button.on{background:var(--verde);color:var(--sobre);box-shadow:var(--sombra-btn)}

.datos{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;font-size:14.5px;padding:10px 0}
.datos dt{color:var(--muted)}.datos dd{margin:0;text-align:right;overflow-wrap:anywhere;font-weight:600}
.contacto{display:flex;gap:14px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.contacto:first-child{border-top:0}
.tel{border:0;background:var(--verde);color:var(--sobre);border-radius:14px;padding:9px 14px;font-weight:700;font-size:13.5px;text-decoration:none;flex:none;box-shadow:var(--sombra-btn)}

.resumen{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cifra{background:var(--card);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sombra)}
.cifra b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.cifra span{color:var(--muted);font-size:13px;font-weight:600}
.cifra.oscura{background:var(--verde);color:var(--sobre);box-shadow:var(--sombra-btn)}.cifra.oscura span{color:var(--sobre);opacity:.75}

/* Comida */
.barra{height:10px;border-radius:6px;background:var(--verde2);overflow:hidden;margin:12px 0 8px}
.barra i{display:block;height:100%;background:var(--verde);border-radius:6px;transition:width .4s}
.barra.pronto i{background:var(--ambar)}.barra.vencido i{background:var(--rojo)}
.grande{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.botones{display:flex;gap:10px;margin:14px 0 8px}
.botones .btn{padding:13px 12px;font-size:15px}

/* Peso */
.grafica{width:100%;height:auto;display:block;margin-bottom:8px}
.grafica .area{fill:var(--verde2)}
.grafica .lin{fill:none;stroke:var(--verde);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.grafica .pt{fill:var(--card);stroke:var(--verde);stroke-width:2.2}
.grafica .rej{stroke:var(--line);stroke-width:1}
.grafica text{fill:var(--muted);font-size:10px;font-family:inherit}

/* Documentos */
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.doc{background:var(--card);border:0;border-radius:var(--r);overflow:hidden;text-align:left;padding:8px;box-shadow:var(--sombra)}
.doc .mini{aspect-ratio:4/3;background:var(--panel) center/cover no-repeat;display:grid;place-items:center;position:relative;border-radius:18px;color:var(--verde)}
.doc .mini svg{width:40px;height:40px}
.doc .mini.pdf{background:var(--verde2)}
.doc .nube{position:absolute;right:7px;top:7px;font-size:11px;background:var(--card);border-radius:8px;padding:2px 6px;color:var(--muted)}
.doc .pie{padding:8px 6px 4px}
.doc .t{font-size:14px;white-space:nowrap}
.doc .s{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ajustes-link{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:26px 0 6px;border:0;background:none;color:var(--muted);font-weight:700;font-size:14px;padding:10px}
.ajustes-link .estado{display:inline-block}
.banda{background:var(--banda);color:var(--banda-txt);margin:30px -20px calc(-120px - env(safe-area-inset-bottom));padding:6px 22px calc(130px + env(safe-area-inset-bottom));border-radius:34px 34px 0 0}
.banda .sec{margin-top:22px}
.banda .link{color:var(--banda-txt);opacity:.8}
.banda .datos{padding:4px 0 0;gap:0}
.banda .datos dt,.banda .datos dd{padding:11px 0;border-top:1px solid color-mix(in srgb,var(--banda-txt) 14%,transparent)}
.banda .datos dt:first-of-type,.banda .datos dd:first-of-type{border-top:0}
.banda .datos dt{color:var(--banda-txt);opacity:.65}
.banda-vacia{opacity:.7;font-size:14.5px;margin:4px 0 0}
.banda .ajustes-link{color:var(--banda-txt);opacity:.7;margin-top:18px}
/* Barra inferior y botón + */
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:0 14px calc(10px + env(safe-area-inset-bottom));z-index:6;pointer-events:none}
nav.tabs .in{display:flex;width:100%;max-width:520px;background:var(--card);border-radius:26px;box-shadow:0 12px 34px rgba(38,46,52,.14);padding:8px;pointer-events:auto}
nav.tabs button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;flex:1;padding:6px 0;border-radius:18px}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button.on{color:var(--sobre);background:var(--verde)}
.fab{position:fixed;right:max(20px,calc(50vw - 360px));bottom:calc(98px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:20px;background:var(--verde);color:var(--sobre);border:2.5px solid var(--sobre);display:grid;place-items:center;box-shadow:var(--sombra-btn);z-index:6}
.fab svg{width:28px;height:28px}

/* Hoja de formulario */
.velo{position:fixed;inset:0;background:rgba(20,28,32,.40);z-index:20;display:none;align-items:flex-end;justify-content:center}
.velo.abierto{display:flex}
.hoja{background:var(--bg);width:100%;max-width:620px;max-height:92vh;max-height:92dvh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:30px 30px 0 0;padding:8px 20px calc(20px + env(safe-area-inset-bottom));animation:sube .26s cubic-bezier(.2,.8,.2,1)}
@keyframes sube{from{transform:translateY(40px);opacity:.4}}
@media (min-width:700px){.velo{align-items:center}.hoja{border-radius:30px;max-height:86vh}}
.asa{width:40px;height:5px;border-radius:3px;background:var(--panel);margin:4px auto 12px}
.hoja-tit{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.hoja-tit h3{font-size:22px;flex:1}
.cerrar{border:0;background:var(--card);width:34px;height:34px;border-radius:50%;font-size:14px;color:var(--muted);box-shadow:var(--sombra)}
.subt{font-size:15px;font-weight:800;margin:24px 4px 0;color:var(--verde)}
label{display:block;font-size:12.5px;color:var(--muted);margin:12px 4px 6px;font-weight:700}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:16px;border:1.5px solid transparent;background:var(--card);color:var(--ink);outline:none;min-height:48px;box-shadow:0 4px 14px rgba(47,90,85,.06)}
input:focus,select:focus,textarea:focus{border-color:var(--verde)}
input[type=date]{-webkit-appearance:none;appearance:none;display:block}
textarea{min-height:84px;resize:vertical}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dos>.campo{min-width:0}
.btn{border:0;border-radius:18px;padding:15px 16px;font-weight:800;background:var(--verde);color:var(--sobre);width:100%;text-align:center;text-decoration:none;display:block;box-shadow:var(--sombra-btn)}
.btn.sec{background:var(--card);color:var(--verde);box-shadow:var(--sombra)}
.btn.peligro{background:none;color:var(--rojo);box-shadow:none}
.acciones{display:grid;gap:10px;margin-top:22px}
.rapido{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.rapido button{border:0;background:var(--card);border-radius:22px;padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:10px;font-weight:700;box-shadow:var(--sombra)}
.rapido button span{width:44px;height:44px;border-radius:14px;background:var(--verde2);color:var(--verde);display:grid;place-items:center}
.rapido button span svg{width:24px;height:24px}
.fotoedit{display:flex;align-items:center;gap:14px;margin:6px 0 2px}
.fotoedit .foto{width:76px;height:76px;border-radius:24px}
.nota{background:var(--card);border-radius:18px;padding:12px 14px;font-size:14px;color:var(--muted);margin-top:12px;box-shadow:var(--sombra)}
.adjuntos{margin-top:4px}

.estado-sync{border-radius:16px;padding:12px 14px;margin:12px 0 0;display:flex;flex-direction:column;gap:3px;font-size:14px;background:var(--card);box-shadow:var(--sombra)}
.estado-sync b{font-size:14.5px}.estado-sync span{color:var(--muted);line-height:1.4}
.estado-sync.bien{background:var(--verde2)}.estado-sync.bien b{color:var(--verde)}
.estado-sync.mal{background:var(--rojo2)}.estado-sync.mal b{color:var(--rojo)}.estado-sync.mal span{color:var(--ink)}

/* Pasaporte de vacunas */
.filtros-pas{display:grid;gap:8px;margin:-4px -20px 14px}
.chips-f{display:flex;gap:7px;overflow-x:auto;padding:2px 20px 4px;scrollbar-width:none}
.chips-f::-webkit-scrollbar{display:none}
.chips-f button{flex:none;border:0;border-radius:13px;padding:8px 13px;font-weight:800;font-size:14px;background:var(--card);color:var(--ink);box-shadow:var(--sombra);display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.chips-f button small{font-size:11px;font-weight:800;color:var(--muted);background:var(--bg);border-radius:8px;padding:1px 6px}
.chips-f button.on{background:var(--verde);color:var(--sobre);box-shadow:var(--sombra-btn)}
.chips-f button.on small{background:color-mix(in srgb,var(--sobre) 20%,transparent);color:var(--sobre)}
.chips-f.vacs button{font-weight:700;font-size:13.5px;padding:7px 12px;border-radius:999px}
.anio-tit{display:flex;align-items:center;gap:10px;margin:20px 4px 10px;font-weight:800;font-size:15px;color:var(--verde)}
.anio-tit::after{content:"";flex:1;height:1px;background:var(--line)}

.pas-estados{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:2px 20px 12px;scroll-snap-type:x mandatory;scrollbar-width:none}
.pas-estados::-webkit-scrollbar{display:none}
.pas-estado{flex:0 0 min(84%,330px);scroll-snap-align:start;text-align:left;border:2px solid transparent;background:var(--card);border-radius:var(--r);padding:14px 16px 12px;box-shadow:var(--sombra)}
.pas-estados .pas-estado:only-child{flex-basis:100%}
.pas-estado.on{border-color:var(--verde)}
.pe-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pe-top b{font-size:18px;font-weight:800}
.pe-hasta{font-size:14px;color:var(--muted);margin-top:4px}.pe-hasta strong{color:var(--ink)}
.pe-pie{font-size:12.5px;color:var(--muted);margin-top:8px}
.tl{margin-top:12px}
.tl-barra{position:relative;height:12px;border-radius:6px;background:var(--line)}
.tl-barra i{position:absolute;top:0;bottom:0;background:var(--verde);border-radius:6px;opacity:.85;box-shadow:inset -1.5px 0 0 var(--card)}
.tl-barra b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--rojo);border-radius:1px}
.tl-anos{position:relative;height:16px;margin-top:3px;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-anos span{position:absolute;transform:translateX(-1px)}
.pas-hoja{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:700px){.pas-hoja{grid-template-columns:1fr 1fr}}
.pas-item{position:relative;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:12px;align-items:center;text-align:left;border:0;padding:14px;border-radius:var(--r);overflow:hidden;color:var(--ink);
  background:var(--card) repeating-linear-gradient(135deg,transparent 0 9px,color-mix(in srgb,var(--verde) 4%,transparent) 9px 10px);box-shadow:var(--sombra)}
.pas-item.vigente{outline:2px solid color-mix(in srgb,var(--verde) 45%,transparent);outline-offset:-2px}
.peg{position:relative;aspect-ratio:1.55;border-radius:10px;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.06),0 4px 10px rgba(0,0,0,.10);overflow:hidden;display:flex;flex-direction:column;color:#222;border:1px solid rgba(0,0,0,.06)}
.peg.foto{background:#fff center/cover no-repeat}
.peg-top{background:var(--pc);color:var(--pf);flex:1.15;padding:8px 10px 6px;display:flex;flex-direction:column;justify-content:flex-end;clip-path:polygon(0 0,100% 0,100% 82%,72% 100%,48% 88%,0 100%)}
.peg-marca{font-weight:800;font-size:15px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.peg-lab{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.85}
.peg-pie{flex:1;display:grid;grid-template-columns:auto 1fr;gap:0 6px;align-content:center;padding:4px 10px;font-size:10px;font-variant-numeric:tabular-nums}
.peg-pie span{color:#888;text-transform:uppercase;letter-spacing:.05em}
.peg-pie b{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;font-weight:600;color:#222;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pas-fechas{list-style:none;margin:0;padding:0;display:grid;gap:5px;position:relative;z-index:1}
.pas-fechas li{display:grid;grid-template-columns:18px 1fr;column-gap:7px;align-items:baseline}
.pas-fechas i{grid-row:span 2;font-style:normal;font-size:10px;font-weight:800;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--verde2);color:var(--verde);align-self:center}
.pas-fechas span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;line-height:1.1}
.pas-fechas b{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.pas-fechas li:last-child b{color:var(--verde)}
.pas-pie{grid-column:1/-1;display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);font-weight:700;border-top:1px dashed var(--line);padding-top:9px;margin-top:-2px}
.pas-pie span:first-child{display:flex;align-items:center;flex:none}
.pas-pie .pas-tipo{color:var(--ink);font-weight:800}
.pas-pie span:last-child{text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sello{position:absolute;right:-10px;bottom:18px;width:96px;height:96px;color:var(--verde);opacity:.16;pointer-events:none}
.pas-vig{font-style:normal;margin-right:6px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--verde);background:var(--verde2);padding:3px 8px;border-radius:999px}
.peg-edit{display:flex;gap:14px;align-items:center;margin:6px 0 2px}
.peg-edit .peg{width:150px;flex:none}
.peg-edit .peg.vacia{display:grid;place-items:center;text-align:center;font-size:12.5px;font-weight:700;color:var(--muted);background:var(--card);border:1.5px dashed var(--panel);box-shadow:none}
.peg-edit-btns{display:grid;gap:8px;flex:1}
.peg-edit-btns .btn{padding:11px 12px;font-size:14.5px}

/* Propuesta 1 · desplegable en píldora */
.f1{display:grid;gap:10px;margin:-4px 0 14px}
.f1-fila{display:flex;gap:8px;align-items:stretch}.f1-fila>*{white-space:nowrap;line-height:1.2}
.f1-anio,.f1-todos{position:relative;display:flex;align-items:center;gap:6px;border:0;border-radius:14px;padding:10px 14px;font-weight:800;font-size:15px;background:var(--card);color:var(--ink);box-shadow:var(--sombra)}
.f1-anio svg{width:16px;height:16px}
.f1-anio select,.f2-op select{position:absolute;inset:0;opacity:0;width:100%;font-size:16px;cursor:pointer}
.f1-anio.on,.f1-todos.on{background:var(--verde);color:var(--sobre);box-shadow:var(--sombra-btn)}
.f1 .chips-f{margin:0 -20px}
/* Propuesta 2 · control segmentado + pestañas subrayadas */
.f2{margin:-4px 0 16px}
.f2-seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:16px;padding:4px;box-shadow:var(--sombra)}
.f2-op{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:none;border-radius:12px;padding:10px;font-weight:800;font-size:15px;color:var(--muted)}
.f2-op svg{width:16px;height:16px}
.f2-op.on{background:var(--verde);color:var(--sobre)}
.f2-tabs{display:flex;gap:20px;overflow-x:auto;margin:12px -20px 0;padding:0 20px;border-bottom:1px solid var(--line);scrollbar-width:none}
.f2-tabs::-webkit-scrollbar{display:none}
.f2-tabs button{flex:none;border:0;background:none;padding:10px 0;font-weight:700;font-size:14.5px;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px}
.f2-tabs button.on{color:var(--ink);border-bottom-color:var(--verde)}
/* Propuesta 3 · año grande con hoja + puntos de color */
.f3{margin:-8px 0 14px}
.f3-cab{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.f3-anio{display:flex;align-items:center;gap:6px;border:0;background:none;padding:0;font-size:30px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
.f3-anio svg{width:22px;height:22px;color:var(--verde);margin-top:4px}
.f3-link{border:0;background:none;color:var(--verde);font-weight:800;font-size:14px;padding:4px 0}
.f3 .chips-f{margin:10px -20px 0}
.f3-vacs button{gap:7px}
.f3-vacs button i{width:9px;height:9px;border-radius:50%;flex:none}
.f3-vacs button.on i{box-shadow:0 0 0 2px var(--sobre)}
.rej-anios{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.rej-anios button{border:0;border-radius:16px;padding:16px 0;font-weight:800;font-size:18px;background:var(--card);color:var(--ink);box-shadow:var(--sombra)}
.rej-anios button.on{background:var(--verde);color:var(--sobre)}

/* Salud: 4 pestañas fijas en 2 filas */
.seg.seg-fija{display:grid;grid-template-columns:1fr 1fr;gap:8px;overflow:visible;margin:6px 0 16px;padding:0}
.seg.seg-fija button{width:100%;padding:11px 8px;text-align:center}
/* Vacunas: cuadrícula de estado */
.vac-cab{display:flex;justify-content:space-between;align-items:baseline;margin:16px 4px 8px;font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.vac-cab button{border:0;background:none;color:var(--verde);font-weight:800;font-size:13.5px;text-transform:none;letter-spacing:0;padding:0}
.vac-rejilla{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.vac-op{position:relative;display:grid;grid-template-columns:10px 1fr;grid-template-rows:auto auto;column-gap:9px;row-gap:3px;align-items:center;text-align:left;border:2px solid transparent;border-radius:18px;padding:12px 12px 11px;background:var(--card);box-shadow:var(--sombra);transition:opacity .2s,border-color .2s}
.vac-op i{grid-row:1/3;width:10px;height:100%;min-height:34px;border-radius:5px;background:var(--vc)}
.vac-op .vo-nom{font-weight:800;font-size:15px;line-height:1.15;color:var(--ink)}
.vac-op .vo-est{font-size:12.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.vac-op .vo-est b{color:#2E9E6A;margin-right:4px}
.vac-op .vo-est.pronto{color:var(--ambar)}.vac-op .vo-est.vencido{color:var(--rojo)}
.vac-op.on{border-color:var(--verde);background:color-mix(in srgb,var(--verde2) 55%,var(--card))}
.vac-op.apagada{opacity:.55}

/* Salud: parte superior (beige) */
.banda-top{margin:0 0 6px}
.banda-top .sec{margin:20px 4px 12px}
.banda-top .seg.seg-fija{margin:6px 0 4px}

/* A · lista */
.va-lista{background:var(--tl);border-radius:18px;overflow:hidden}
.va-fila{width:100%;display:grid;grid-template-columns:10px 1fr auto 20px;gap:12px;align-items:center;border:0;background:none;color:var(--banda-txt);padding:13px 14px;text-align:left;border-top:1px solid color-mix(in srgb,var(--banda-txt) 9%,transparent)}
.va-fila:first-child{border-top:0}
.va-fila i{width:10px;height:10px;border-radius:50%}
.va-nom{font-weight:800;font-size:15px}
.va-est{font-size:13px;font-weight:700;opacity:.75;font-variant-numeric:tabular-nums}
.va-est.vencido{color:#F4A08F;opacity:1}.va-est.pronto{color:#F2C878;opacity:1}
.va-chk{width:18px;height:18px;opacity:0;color:var(--banda-txt)}
.va-fila.on{background:var(--tl2)}.va-fila.on .va-chk{opacity:1}
.va-fila.apagada{opacity:.5}
/* B · anillos */
.vb-fila{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.vb-op{border:0;background:none;color:var(--banda-txt);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:16px}
.vb-op svg{width:58px;height:58px;transform:rotate(-90deg)}
.vb-op svg text{transform:rotate(90deg);transform-origin:30px 30px;fill:var(--banda-txt);font-weight:800;font-size:17px;font-family:inherit}
.vb-fondo{fill:none;stroke:var(--tl2);stroke-width:5}
.vb-arco{fill:none;stroke-width:5;stroke-linecap:round}
.vb-nom{font-weight:800;font-size:13px}
.vb-est{font-size:11.5px;font-weight:700;opacity:.7;font-variant-numeric:tabular-nums}
.vb-est.vencido{color:#F4A08F;opacity:1}.vb-est.pronto{color:#F2C878;opacity:1}
.vb-op.on{background:var(--tl2)}
.vb-op.apagada{opacity:.45}
/* C · segmentado */
.vc-seg{display:grid;grid-template-columns:repeat(5,auto);background:var(--tl);border-radius:16px;padding:4px;gap:2px}
.vc-seg button{border:0;background:none;color:var(--banda-txt);opacity:.75;font-weight:800;font-size:13.5px;padding:10px 2px;border-radius:12px;white-space:nowrap}
.vc-seg button.on{background:var(--banda-txt);color:var(--banda);opacity:1}
.vc-info{display:flex;align-items:center;gap:8px;margin:12px 4px 0;font-size:14px}
.vc-info i{width:10px;height:10px;border-radius:50%;flex:none}
.vc-info span{opacity:.75;font-weight:700}.vc-info span.vencido{color:#F4A08F;opacity:1}

/* Ficha en forma de tarjeta */
.tarjeta{perspective:1200px;cursor:pointer;max-width:420px;margin:0 auto}
.tj-in{position:relative;aspect-ratio:1.586;max-width:100%;transition:transform .7s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d}
.tarjeta.girada .tj-in{transform:rotateY(180deg)}
.tj-cara{position:absolute;inset:0;border-radius:18px;overflow:hidden;-webkit-backface-visibility:hidden;backface-visibility:hidden;color:#F6F0E6;box-shadow:0 14px 30px rgba(20,40,48,.28),inset 0 0 0 1px rgba(255,255,255,.08);
  background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.14),transparent 55%),repeating-radial-gradient(circle at 15% 120%,rgba(255,255,255,.05) 0 1px,transparent 1px 7px),linear-gradient(135deg,#1F4B57 0%,#2C6170 55%,#163843 100%)}
.tj-frente{padding:16px 18px;display:grid;grid-template-rows:auto auto 1fr auto auto;row-gap:6px}
.tj-top{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;font-weight:800;letter-spacing:.14em}
.tj-tipo{opacity:.6}
.tj-chip{width:40px;height:30px;border-radius:6px;background:linear-gradient(135deg,#EFE4CF,#CDBB98);position:relative;margin-top:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.tj-chip i{position:absolute;inset:6px 8px;border:1px solid rgba(60,50,30,.35);border-radius:3px}
.tj-chip i::before,.tj-chip i::after{content:"";position:absolute;left:-8px;right:-8px;top:50%;height:1px;background:rgba(60,50,30,.35)}
.tj-chip i::after{left:50%;right:auto;top:-6px;bottom:-6px;width:1px;height:auto}
.tj-num{align-self:end;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:clamp(15px,5vw,20px);letter-spacing:.08em;font-weight:600;text-shadow:0 1px 0 rgba(0,0,0,.25);white-space:nowrap}
.tj-num em{font-family:var(--f);font-style:normal;font-size:14px;opacity:.7;letter-spacing:0}
.tj-extra{font-size:10.5px;opacity:.7;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tj-pie{display:grid;grid-template-columns:1.3fr auto 1fr;gap:12px;align-items:end;padding-right:34px}
.tj-c{min-width:0}
.tj-c span{display:block;font-size:8.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.6}
.tj-c b{display:block;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.tj-huella{position:absolute;right:16px;bottom:16px;width:28px;height:28px;opacity:.85;color:#EFE4CF}
.tj-dorso{transform:rotateY(180deg);display:flex;flex-direction:column}
.tj-banda{height:34px;margin-top:16px;background:#0F262D;flex:none}
.tj-dueno{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;padding:10px 18px 0}
.tj-dueno .ancho{grid-column:1/-1}
.tj-dueno .tj-c b{font-size:12.5px}
.tj-vacio{margin:6px 0 0;font-size:13px;opacity:.8;grid-column:1/-1}
.tj-notas{margin-top:auto;padding:0 18px 12px;font-size:10px;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tj-ayuda{text-align:center;font-size:12.5px;color:var(--muted);margin:10px 0 0}

/* Ficha (chapa sin medalla) */
.f1c{background:var(--card);border-radius:var(--r);box-shadow:var(--sombra);padding:18px 18px 16px;display:grid;gap:14px}
.f1c-tit h3{font-size:30px;line-height:1.05;letter-spacing:-.02em}
.f1c-tit span{display:block;color:var(--muted);font-size:17px;font-weight:700;margin-top:3px}
.f1c-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.f1c-grid span{display:block;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.f1c-grid b{display:block;font-size:14.5px;font-weight:800;overflow-wrap:anywhere}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-weight:600!important;letter-spacing:.02em}
.f1c-dueno{border-top:1.5px dashed var(--line);padding-top:12px;display:grid;gap:1px;font-size:14px;cursor:pointer}
.f1c-dueno .f1c-et{font-size:11px;font-weight:800;color:var(--verde);text-transform:uppercase;letter-spacing:.08em}
.f1c-dueno b{font-size:15px}
.f1c-dueno span{color:var(--muted)}

.pliegue-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;border:0;border-top:1px solid var(--line);background:none;color:var(--verde);font-weight:800;font-size:14px;padding:13px 0 8px;font-family:inherit}
.pliegue-btn svg{width:16px;height:16px;transition:transform .2s}
.pliegue.abierto .pliegue-btn svg{transform:rotate(180deg)}
.pliegue .fila:first-child{border-top:1px solid var(--line)}
.banda-top + .card,.banda-top + .cons-lista{margin-top:22px}

/* Ficha oscura + QR */
.f1c.oscura{background:var(--banda);color:var(--banda-txt);box-shadow:0 14px 30px rgba(20,40,48,.22)}
.f1c-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.f1c.oscura .f1c-tit h3{color:var(--banda-txt)}
.f1c.oscura .f1c-tit span,.f1c.oscura .f1c-grid span{color:var(--banda-txt);opacity:.62}
.f1c.oscura .f1c-grid b{color:var(--banda-txt)}
.f1c.oscura .f1c-dueno{border-top-color:color-mix(in srgb,var(--banda-txt) 22%,transparent)}
.f1c.oscura .f1c-dueno .f1c-et{color:#9FD3C4}
.f1c.oscura .f1c-dueno b{color:var(--banda-txt)}
.f1c.oscura .f1c-dueno span{color:var(--banda-txt);opacity:.7}
.f1c-qr{flex:none;width:76px;height:76px;padding:0;border:0;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.f1c-qr svg{width:100%;height:100%;display:block}
.f1c-qr.vacio{background:none;border:1.5px dashed color-mix(in srgb,var(--banda-txt) 45%,transparent);color:var(--banda-txt);font-weight:800;font-size:13px;box-shadow:none}
.qr-grande{width:min(72vw,300px);margin:8px auto 0;border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
.qr-grande svg{display:block;width:100%;height:auto}
/* Consultas con diagnóstico y tratamiento visibles (en Salud) */
.cons-lista{display:grid;gap:12px}
.cons-item{background:var(--card);border-radius:var(--r);box-shadow:var(--sombra);padding:14px 16px;text-align:left;border:0;width:100%;display:grid;gap:8px;cursor:pointer;color:var(--ink);font-family:inherit}
.cons-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cons-cab b{font-size:16.5px;font-weight:800;line-height:1.25}
.cons-cab .s{display:block;margin-top:2px}
.cons-bloque span{display:block;font-size:11px;font-weight:800;color:var(--verde);text-transform:uppercase;letter-spacing:.07em;margin-bottom:2px}
.cons-bloque p{margin:0;font-size:14.5px;line-height:1.45;white-space:pre-wrap}
.cons-pie{font-size:12.5px;color:var(--muted);font-weight:700;display:flex;gap:12px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:8px}
/* Peso ajustado a la pantalla */
#v-peso.activa{display:flex;flex-direction:column;overflow:hidden}
#v-peso .peso-graf{flex:1 1 auto;min-height:150px;display:flex;flex-direction:column;margin-bottom:0}
#v-peso .peso-graf .graf-caja{flex:1;min-height:0;margin-top:6px}
#v-peso .peso-graf .grafica{width:100%;height:100%;margin:0}
#v-peso .sec{flex:none;margin:16px 4px 10px}
#v-peso .peso-regs{flex:0 1 auto;min-height:0;overflow:auto;margin-bottom:0;-webkit-overflow-scrolling:touch}

/* Peso A · calendario */
.pa-fila,.pb-fila,.pc-fila{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;background:none;padding:10px 0;border-top:1px solid var(--line);text-align:left;color:var(--ink);font-family:inherit}
.peso-regs > :first-child,.pliegue > :first-child{border-top:0}
.pa-kg{display:flex;align-items:baseline;gap:5px}
.pa-kg b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pa-kg span{font-weight:700;color:var(--muted)}
.pa-kg em{font-style:normal;font-size:12px;font-weight:800;margin-left:6px;padding:2px 7px;border-radius:999px;background:var(--bg);color:var(--muted)}
.pa-kg em.sube{color:#2E8C5E}.pa-kg em.baja{color:var(--ambar)}
.pa-cal{width:52px;border-radius:12px;overflow:hidden;background:var(--card);box-shadow:0 2px 8px rgba(30,50,55,.12);text-align:center;flex:none;display:grid}
.pa-cal span{background:var(--verde);color:var(--sobre);font-size:10px;font-weight:800;letter-spacing:.08em;padding:2px 0}
.pa-cal b{font-size:22px;font-weight:800;line-height:1.1;padding-top:3px}
.pa-cal i{font-style:normal;font-size:9.5px;color:var(--muted);font-weight:700;padding-bottom:3px}
/* Peso B · fecha grande */
.pb-kg{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.pb-kg span{font-size:15px;color:var(--muted);font-weight:700}
.pb-kg small{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.pb-fecha{display:flex;align-items:baseline;gap:7px;text-align:left}
.pb-fecha b{font-size:34px;font-weight:800;line-height:1;color:var(--verde);font-variant-numeric:tabular-nums}
.pb-fecha em{font-style:normal;font-size:34px;font-weight:300;line-height:1;color:var(--verde);letter-spacing:.02em}
.pb-fecha span{font-size:12px;font-weight:700;color:var(--muted);align-self:center}
/* Peso C · barra + fecha en bloque */
.pc-kg{flex:1;min-width:0}
.pc-kg b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.pc-barra{height:6px;border-radius:3px;background:var(--verde2);margin-top:6px;max-width:180px}
.pc-barra i{display:block;height:100%;border-radius:3px;background:var(--verde)}
.pc-fecha{display:flex;align-items:center;gap:8px;padding-left:12px;border-left:1.5px solid var(--line)}
.pc-fecha b{font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}

let D; try { D = Object.assign(vacio(), JSON.parse(localStorage.getItem('mm-datos') || '{}')); } catch { D = vacio(); }
let CFG; try { CFG = JSON.parse(localStorage.getItem('mm-cfg') || '{}'); } catch { CFG = {}; }
const guardarLocal = () => localStorage.setItem('mm-datos', JSON.stringify(D));
const vivos = c => D[c].filter(x => !x.borrado);

function guardarItem(c, obj) {
  obj = { ...obj, upd: Date.now() };
  if (!obj.id) obj.id = uid();
  const i = D[c].findIndex(x => x.id === obj.id);
  if (i >= 0) D[c][i] = obj; else D[c].push(obj);
  cambio();
  return obj;
}
function borrarItem(c, id) {
  const i = D[c].findIndex(x => x.id === id);
  if (i < 0) return;
  const x = D[c][i];
  D[c][i] = { id: x.id, borrado: true, upd: Date.now(), ...(x.driveId ? { driveId: x.driveId } : {}) };
  cambio();
}
function guardarObj(k, cambios) { D[k] = { ...D[k], ...cambios, upd: Date.now() }; cambio(); }
function cambio() { guardarLocal(); render(); programarSync(); }

// Igual que en Code.gs: gana la versión más reciente de cada elemento
function fusionar(a, b) {
  const r = vacio();
  a = a || {}; b = b || {};
  for (const k of ['perfil', 'comida']) r[k] = ((b[k] && b[k].upd) || 0) > ((a[k] && a[k].upd) || 0) ? b[k] : (a[k] || { upd: 0 });
  for (const c of LISTAS) {
    const m = new Map();
    for (const x of [...(a[c] || []), ...(b[c] || [])]) { const y = m.get(x.id); if (!y || (x.upd || 0) > (y.upd || 0)) m.set(x.id, x); }
    r[c] = [...m.values()];
  }
  return r;
}

// Un registro sigue "pendiente" si tiene próxima fecha y no hay otro posterior con el mismo nombre
function pendiente(s, lista) {
  if (!s.proxima) return false;
  return !lista.some(o => o.id !== s.id && norm(o.nombre) === norm(s.nombre) && (o.fecha || '') > (s.fecha || ''));
}
function pienso() {
  const c = D.comida;
  if (!(c.racionG > 0 && c.sacoKg > 0 && c.sacoFecha)) return null;
  const dias = Math.floor(c.sacoKg * 1000 / c.racionG);
  const fin = sumarDias(c.sacoFecha, dias);
  const quedan = diasHasta(fin);
  return { dias, fin, quedan, pct: Math.max(0, Math.min(1, quedan / dias)) };
}
function proximoCumple() {
  const n = D.perfil.nacimiento; if (!n) return null;
  const h = aFecha(hoy()), a = aFecha(n);
  let c = new Date(h.getFullYear(), a.getMonth(), a.getDate());
  if (c < h) c = new Date(h.getFullYear() + 1, a.getMonth(), a.getDate());
  return { fecha: deFecha(c), anios: c.getFullYear() - a.getFullYear() };
}
function avisos() {
  const L = vivos('salud');
  const r = L.filter(s => pendiente(s, L) && diasHasta(s.proxima) >= -60).map(s => ({ fecha: s.proxima, titulo: s.nombre || TIPOS[s.tipo]?.n, sub: TIPOS[s.tipo]?.n || '', ico: TIPOS[s.tipo]?.ico || '🩺', abrir: `formSalud(D.salud.find(x=>x.id==='${s.id}'))` }));
  const p = pienso();
  if (false && p) r.push({ fecha: p.fin, titulo: 'Se acaba el pienso', sub: D.comida.pienso || 'Pienso', ico: '🥣', terra: 1, abrir: `irA('comida')` });
  const cu = proximoCumple();
  if (cu && diasHasta(cu.fecha) <= 45) r.push({ fecha: cu.fecha, titulo: `Cumple ${cu.anios} ${cu.anios === 1 ? 'año' : 'años'}`, sub: fmt(cu.fecha), ico: '🎂', terra: 1, abrir: 'editarPerfil()', cumple: 1 });
  return r.sort((a, b) => a.fecha.localeCompare(b.fecha));
}
function pillFecha(f) {
  const d = diasHasta(f);
  let cls = 'ok', t;
  if (d < 0) { cls = 'vencido'; t = d === -1 ? 'ayer' : `hace ${-d} días`; }
  else if (d === 0) { cls = 'vencido'; t = 'hoy'; }
  else if (d === 1) { cls = 'pronto'; t = 'mañana'; }
  else if (d <= 14) { cls = 'pronto'; t = `en ${d} días`; }
  else t = d <= 45 ? `en ${d} días` : fmtCorto(f) + (aFecha(f).getFullYear() !== new Date().getFullYear() ? ' ' + aFecha(f).getFullYear() : '');
  return `<span class="pill ${cls}">${t}</span>`;
}
function edad(n) {
  if (!n) return '';
  const a = aFecha(n), h = aFecha(hoy());
  let m = (h.getFullYear() - a.getFullYear()) * 12 + h.getMonth() - a.getMonth();
  if (h.getDate() < a.getDate()) m--;
  if (m < 0) return '';
  const y = Math.floor(m / 12), mm = m % 12;
  if (y === 0) return `${mm} ${mm === 1 ? 'mes' : 'meses'}`;
  return `${y} ${y === 1 ? 'año' : 'años'}` + (mm ? ` y ${mm} ${mm === 1 ? 'mes' : 'meses'}` : '');
}
const pesos = () => vivos('peso').filter(p => p.kg > 0 && p.fecha).sort((a, b) => a.fecha.localeCompare(b.fecha));
const anios = n => { const e = edad(n); if (!e) return ''; return e.replace(/ y \d+ mes(es)?$/, ''); };
const medActiva = m => !m.fin || m.fin >= hoy();

    if (!items.length) h += `<div class="card">${vacioHTML(subSalud === 'vacunas' ? '💉' : '💊', subSalud === 'vacunas' ? 'Apunta sus vacunas con el botón +. Si pones la próxima dosis, te avisaré en el calendario.' : 'Apunta pastillas, pipetas y collares con el botón +. Te avisaré cuando toque el siguiente.')}</div>`;
    if (pend.length) h += `<div class="sec"><h2>Próximas</h2></div><div class="card">${pend.map(s => filaSalud(s, L)).join('')}</div>`;
    if (hist.length) h += `<div class="sec"><h2>Historial</h2></div><div class="card">${hist.map(s => filaSalud(s, L)).join('')}</div>`;
  } else if (subSalud === 'consultas') {
    const cons = vivos('consultas').sort(porFechaDesc);
    h += cons.length ? consultasDesplegables(cons) : `<div class="card">${vacioHTML('🩺', 'Apunta cada visita: motivo, diagnóstico, tratamiento y coste. Puedes adjuntarle informes y facturas.')}</div>`;
  } else {
    const meds = vivos('medicacion').sort((a, b) => (b.inicio || '').localeCompare(a.inicio || ''));
    const act = meds.filter(medActiva), ant = meds.filter(m => !medActiva(m));
    const f = m => fila({ ico: '💧', t: m.nombre, s: [m.dosis, m.frecuencia, m.inicio ? fmt(m.inicio) + (m.fin ? ' → ' + fmt(m.fin) : '') : '', m.motivo].filter(Boolean).join(' · '), der: medActiva(m) ? '<span class="pill ok">activa</span>' : '', abrir: `formMed(D.medicacion.find(x=>x.id==='${m.id}'))` });
    if (!meds.length) h += `<div class="card">${vacioHTML('💧', 'Aquí van los tratamientos: antibióticos, antiinflamatorios, gotas… con dosis y duración.')}</div>`;
    if (act.length) h += `<div class="sec"><h2>Activa</h2></div><div class="card">${act.map(f).join('')}</div>`;
    if (ant.length) h += `<div class="sec"><h2>Anteriores</h2></div><div class="card">${ant.map(f).join('')}</div>`;
  }
  // Parte superior (pestañas + controles del pasaporte) en franja oscura
  const corte = h.indexOf('<!--fin-top-->');
  const finSeg = h.indexOf('</div>') + 6;
  const top = corte >= 0 ? h.slice(0, corte) : h.slice(0, finSeg), resto = corte >= 0 ? h.slice(corte) : h.slice(finSeg);
  h = `<section class="banda-top">${top}</section>${resto}`;
  $('#v-salud').innerHTML = conIconos(h);
}


/* ---------- pasaporte de vacunas ---------- */
let filtroVac = 'Todas', filtroAnio = '', filtroAnioPrev = '';
function hojaAnios(anios) {
  abrirHoja(`<div class="asa"></div><div class="hoja-tit"><h3>Elige el año</h3><button class="cerrar" onclick="cerrarHoja()">✕</button></div>
  <div class="rej-anios">${anios.map(a => `<button class="${filtroAnio === a ? 'on' : ''}" onclick="filtroAnio='${a}';filtroAnioPrev='${a}';cerrarHoja();render()">${a}</button>`).join('')}</div>
  <div class="acciones"><button class="btn sec" onclick="filtroAnio='Todos';cerrarHoja();render()">Todos los años</button></div>`);
}
const MARCAS = [
  [/eurican.*pneumo/i, '#F2B6CF', '#5A1E3A'], [/eurican.*(dappi|lmulti)/i, '#2D5C9A', '#fff'], [/letifend|leti\b/i, '#3E8FCF', '#fff'], [/canigen/i, '#2E8B3E', '#fff'], [/eurican/i, '#C8202F', '#fff'], [/rabigen|virbac/i, '#1F5FA6', '#fff'], [/versiguard|zoetis|vanguard/i, '#F4F1EA', '#B3262E'],
  [/nobivac|msd/i, '#0E7C7B', '#fff'], [/canigen/i, '#2C6E3F', '#fff'], [/letifend|canileish/i, '#6B3FA0', '#fff'],
];
const colorMarca = t => { for (const [re, bg, fg] of MARCAS) if (re.test(t || '')) return [bg, fg]; return ['var(--verde)', 'var(--sobre)']; };
const fmtNum = s => { if (!s) return '—'; const d = aFecha(s); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`; };

function sello(texto, k) {
  const t = esc((texto || 'Veterinario').toUpperCase()).slice(0, 34);
  const rot = [-14, 9, -6, 13, -10][k % 5];
  return `<svg class="sello" viewBox="0 0 100 100" style="transform:rotate(${rot}deg)" aria-hidden="true"><defs><path id="sc${k}" d="M50 50 m-36 0 a36 36 0 1 1 72 0 a36 36 0 1 1 -72 0"/></defs><circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="50" cy="50" r="27" fill="none" stroke="currentColor" stroke-width="1.4"/><text font-size="9.5" font-weight="800" letter-spacing="1.2" fill="currentColor"><textPath href="#sc${k}" startOffset="0">${t} · ${t}</textPath></text><g transform="translate(38 38) scale(1)" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${SVG.perro}</g></svg>`;
}

function lineaTiempo(regs) {
  const r = regs.filter(x => x.fecha).map(x => ({ a: x.validaDesde || x.fecha, b: x.proxima || sumarMeses(x.fecha, 12) })).sort((p, q) => p.a.localeCompare(q.a));
  if (!r.length) return '';
  const y0 = aFecha(r[0].a).getFullYear(), y1 = Math.max(aFecha(r.at(-1).b).getFullYear(), new Date().getFullYear()) + 1;
  const t0 = new Date(y0, 0, 1).getTime(), t1 = new Date(y1, 0, 1).getTime(), X = s => ((aFecha(s).getTime() - t0) / (t1 - t0) * 100).toFixed(2);
  const hoyX = X(hoy());
  let segs = r.map(p => `<i style="left:${X(p.a)}%;width:${Math.max(.8, X(p.b) - X(p.a))}%"></i>`).join('');
  let anos = ''; for (let y = y0; y < y1; y++) anos += `<span style="left:${X(y + '-01-01')}%">${String(y).slice(2)}</span>`;
  return `<div class="tl"><div class="tl-barra">${segs}<b style="left:${hoyX}%"></b></div><div class="tl-anos">${anos}</div></div>`;
}

function renderPasaporte() {
  const L = vivos('salud');
  const vac = L.filter(s => s.tipo === 'vacuna').sort(porFechaDesc);
  const otros = L.filter(s => s.tipo === 'otro').sort(porFechaDesc);
  if (!vac.length && !otros.length) return `<div class="card">${vacioHTML('💉', 'Aquí tendrás tu propio pasaporte: cada vacuna con su pegatina, lote, fechas y sello. Pulsa + para apuntar la primera.')}</div>`;
  const grupos = {};
  vac.forEach(v => { const k = (v.nombre || 'Vacuna').trim(); (grupos[k] = grupos[k] || []).push(v); });
  const nombres = Object.keys(grupos).sort((a, b) => grupos[b].length - grupos[a].length);
  if (filtroVac !== 'Todas' && !grupos[filtroVac]) filtroVac = 'Todas';
  let h = '';
  // Filtros: año (actual por defecto, desplegable para los anteriores) + «Todos»; debajo, vacunas
  const anioDe = v => (v.fecha || '').slice(0, 4);
  const actual = String(new Date().getFullYear());
  const todosAnios = [...new Set([actual, ...vac.map(anioDe).filter(Boolean)])].sort().reverse();
  if (!filtroAnio || (filtroAnio !== 'Todos' && !todosAnios.includes(filtroAnio))) filtroAnio = actual;
  filtroVac = 'Todas';
  const porVac = vac;
  const anios = [...new Set(porVac.map(anioDe).filter(Boolean))].sort().reverse();
  const lista = filtroAnio === 'Todos' ? porVac : porVac.filter(v => anioDe(v) === filtroAnio);
  const anioSel = filtroAnio === 'Todos' ? (filtroAnioPrev || actual) : filtroAnio;
  const opcionesAnio = todosAnios.map(a => `<option value="${a}" ${a === anioSel ? 'selected' : ''}>${a}</option>`).join('');
  const selAnio = cls => `<label class="${cls} ${filtroAnio !== 'Todos' ? 'on' : ''}"><span>${anioSel}</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg><select aria-label="Año" onchange="filtroAnio=this.value;filtroAnioPrev=this.value;render()" onclick="if(filtroAnio==='Todos'){filtroAnio=this.value;render()}">${opcionesAnio}</select></label>`;
  const btnTodos = cls => `<button class="${cls} ${filtroAnio === 'Todos' ? 'on' : ''}" onclick="filtroAnioPrev=filtroAnio==='Todos'?filtroAnioPrev:filtroAnio;filtroAnio='Todos';render()">Todos los años</button>`;
  const colorVac = n => ({ 'Rabia': '#C8202F', 'Polivalente': '#2D5C9A', 'Leishmaniosis': '#3E8FCF', 'Tos de las perreras': '#D77AA6' })[n] || 'var(--verde)';
  const vacsLista = ['Todas', ...nombres];
  h += `<div class="sec"><h2>Pasaporte</h2><span class="s">${lista.length} ${lista.length === 1 ? 'vacunación' : 'vacunaciones'}</span></div>`;
  // Año: control segmentado (año actual con desplegable | todos los años)
  h += `<div class="f2"><div class="f2-seg">${selAnio('f2-op')}${btnTodos('f2-op')}</div></div>`;
  // Vacunas: cuadrícula fija con el estado de cada una; tocar filtra, volver a tocar quita el filtro
  // (menú de vacunas eliminado: se ven todas las del año elegido)
  h += `<!--fin-top-->`;
  if (!lista.length) h += `<div class="card">${vacioHTML('💉', filtroAnio === 'Todos' ? 'No hay vacunas de este tipo.' : `En ${filtroAnio} no hay ${filtroVac === 'Todas' ? 'vacunas apuntadas' : 'dosis de ' + esc(filtroVac).toLowerCase()}. Elige otro año en el desplegable o «Todos los años».`)}</div>`;
  const tarjeta = (v, k) => {
    const [bg, fg] = colorMarca(v.producto + ' ' + (v.laboratorio || ''));
    const vigente = v.proxima && diasHasta(v.proxima) >= 0 && (!v.validaDesde || diasHasta(v.validaDesde) <= 0) && diasHasta(v.fecha) <= 0;
    const mV = window.MODO_VCARD || '2'; if (mV !== '0') return tarjetaVac(v, k, mV, bg, fg, vigente);
    const peg = v.fotoPeg
      ? `<div class="peg foto" style="background-image:url('${v.fotoPeg}')"></div>`
      : `<div class="peg" style="--pc:${bg};--pf:${fg}"><div class="peg-top"><span class="peg-marca">${esc(v.producto || v.nombre || 'Vacuna')}</span>${v.laboratorio ? `<span class="peg-lab">${esc(v.laboratorio)}</span>` : ''}</div><div class="peg-pie"><span>Lote</span><b>${esc(v.lote || '—')}</b><span>CAD</span><b>${esc(v.caducidad || '—')}</b></div></div>`;
    const filas = v.validaDesde
      ? [['Vacunación', v.fecha], ['Válida desde', v.validaDesde], ['Válida hasta', v.proxima]]
      : [['Vacunación', v.fecha], ['Válida hasta', v.proxima]];
    return `<button class="pas-item ${vigente ? 'vigente' : ''}" onclick="formSalud(D.salud.find(x=>x.id==='${v.id}'))">
      ${peg}
      <ol class="pas-fechas">${filas.map(([t, f], j) => `<li><i>${j + 1}</i><span>${t}</span><b>${fmtNum(f)}</b></li>`).join('')}</ol>
      <div class="pas-pie"><span>${vigente ? '<em class="pas-vig">En vigor</em>' : ''}</span><span class="pas-tipo">${esc(v.nombre || '')}</span></div>
      ${sello(v.vet, k)}
    </button>`;
  };
  if (filtroAnio === 'Todos') {
    let k = 0;
    h += anios.map(a => `<div class="anio-tit"><span>${a}</span></div><div class="pas-hoja">${porVac.filter(v => anioDe(v) === a).map(v => tarjeta(v, k++)).join('')}</div>`).join('');

  }
  if (otros.length) h += `<div class="sec"><h2>Revisiones y test</h2></div><div class="card">${otros.map(s => filaSalud(s, L)).join('')}</div>`;
  return h;
}


/* ---------- propuestas de ficha de vacuna ---------- */
function tarjetaVac(v, k, m, bg, fg, vigente) {
  const abrir = `formSalud(D.salud.find(x=>x.id==='${v.id}'))`;
  const caducada = v.proxima && diasHasta(v.proxima) < 0;
  const est = vigente ? ['ok', 'En vigor'] : caducada ? ['neutro', 'Caducada'] : ['pronto', 'Pendiente'];
  const corta = f => { if (!f) return '—'; const d = aFecha(f); return `${d.getDate()} ${MESES[d.getMonth()]} ${String(d.getFullYear()).slice(2)}`; };
  const marca = esc(v.producto || v.nombre || 'Vacuna'), tipo = esc(v.nombre || ''), lab = esc(v.laboratorio || '');
  const fotoMini = v.fotoPeg ? `style="background-image:url('${v.fotoPeg}');background-size:cover"` : '';
  if (m === '1') {
    return `<button class="v1" onclick="${abrir}" style="--pc:${bg}"><i class="v1-barra"></i><div class="v1-cuerpo">
      <div class="v1-top"><span class="v1-tipo">${tipo}</span><span class="pill ${est[0]}">${est[1]}</span></div>
      <b class="v1-marca">${marca}${lab ? ` <small>${lab}</small>` : ''}</b>
      <div class="v1-fechas"><span>${corta(v.fecha)}</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span>${corta(v.proxima)}</span></div>
      <div class="v1-pie">Lote <b>${esc(v.lote || '—')}</b> · CAD <b>${esc(v.caducidad || '—')}</b>${v.validaDesde ? ` · desde ${corta(v.validaDesde)}` : ''}</div></div></button>`;
  }
  if (m === '2') {
    return `<button class="v2" onclick="${abrir}"><div class="v2-talon" style="--pc:${bg};--pf:${fg}"><span>${tipo}</span></div><div class="v2-cuerpo">
      <div class="v2-top"><b>${marca}</b><span class="pill ${est[0]}">${est[1]}</span></div>
      <div class="v2-vuelo"><div><span>Vacunado</span><b>${corta(v.fecha)}</b></div><div class="v2-linea"><i></i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg><i></i></div><div class="v2-dcha"><span>Válida hasta</span><b>${corta(v.proxima)}</b></div></div>
      <div class="v2-pie"><span>${lab || '&nbsp;'}</span><span>Lote ${esc(v.lote || '—')} · CAD ${esc(v.caducidad || '—')}</span></div></div></button>`;
  }
  if (m === '3') {
    const ini = v.validaDesde || v.fecha, fin = v.proxima;
    let pct = 0; if (ini && fin) { const tot = Math.max(1, diasEntre(ini, fin)); pct = Math.max(0, Math.min(100, (tot - Math.max(0, diasHasta(fin))) / tot * 100)); }
    return `<button class="v3" onclick="${abrir}"><div class="v3-cab"><div class="v3-mini" style="--pc:${bg};--pf:${fg}" ${fotoMini}>${v.fotoPeg ? '' : marca.slice(0, 1)}</div><div class="v3-txt"><b>${marca}</b><span>${tipo}${lab ? ' · ' + lab : ''}</span></div><span class="pill ${est[0]}">${est[1]}</span></div>
      <div class="v3-hasta"><span>Válida hasta</span><b>${v.proxima ? fmt(v.proxima) : '—'}</b></div>
      <div class="v3-barra ${caducada ? 'fin' : ''}"><i style="width:${pct.toFixed(0)}%"></i></div>
      <div class="v3-ext"><span>${corta(ini)}</span><span>${corta(fin)}</span></div>
      <div class="v3-chips"><span>Lote ${esc(v.lote || '—')}</span><span>CAD ${esc(v.caducidad || '—')}</span>${v.vet ? `<span>${esc(v.vet)}</span>` : ''}</div></button>`;
  }
  // 4 · Pegatina protagonista
  const barras = Array.from({ length: 34 }, (_, i) => `<i style="width:${[1, 2, 1, 3, 1, 2][(i * 7 + (v.lote || '').length) % 6]}px"></i>`).join('');
  const filas = v.validaDesde ? [['Vacunación', v.fecha], ['Desde', v.validaDesde], ['Hasta', v.proxima]] : [['Vacunación', v.fecha], ['Hasta', v.proxima]];
  return `<button class="v4" onclick="${abrir}">
    ${v.fotoPeg ? `<div class="v4-peg foto" style="background-image:url('${v.fotoPeg}')"></div>` : `<div class="v4-peg" style="--pc:${bg};--pf:${fg}"><div class="v4-band"><b>${marca}</b>${lab ? `<span>${lab}</span>` : ''}</div><div class="v4-datos"><div><span>LOTE</span><b>${esc(v.lote || '—')}</b></div><div><span>CAD</span><b>${esc(v.caducidad || '—')}</b></div><div class="v4-cod">${barras}</div></div></div>`}
    <div class="v4-fechas" style="grid-template-columns:repeat(${filas.length},1fr)">${filas.map(([t, f], j) => `<div><span><em>${j + 1}</em>${t}</span><b>${corta(f)}</b></div>`).join('')}</div>
    <div class="v4-pie"><span class="pill ${est[0]}">${est[1]}</span><b>${tipo}</b></div>
    ${sello(v.vet, k)}</button>`;
}

function grafica(ps, W = 340, H = 150) {
  if (ps.length < 2) return '';
  const pl = 32, pr = 12, pt = 12, pb = 24;
  const xs = ps.map(p => aFecha(p.fecha).getTime()), ys = ps.map(p => Number(p.kg));
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x1 === x0) x1 = x0 + 864e5;
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const m = Math.max(.4, (y1 - y0) * .2); y0 -= m; y1 += m;
  const X = t => pl + (t - x0) / (x1 - x0) * (W - pl - pr), Y = v => pt + (1 - (v - y0) / (y1 - y0)) * (H - pt - pb);
  const pts = ps.map((p, i) => [X(xs[i]), Y(ys[i])]);
  const lin = pts.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join('');
  const area = lin + `L${pts.at(-1)[0].toFixed(1)} ${H - pb}L${pts[0][0].toFixed(1)} ${H - pb}Z`;
  let rej = '';
  for (let i = 0; i < 3; i++) { const v = y0 + (y1 - y0) * (i + .5) / 3, y = Y(v); rej += `<line class="rej" x1="${pl}" x2="${W - pr}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text x="${pl - 6}" y="${(y + 3).toFixed(1)}" text-anchor="end">${num(Math.round(v * 10) / 10)}</text>`; }
  const pf = ps.length > 24 ? '' : pts.map(q => `<circle class="pt" cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="3.2"/>`).join('');
  return `<svg class="grafica" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del peso">${rej}<path class="area" d="${area}" opacity=".8"/><path class="lin" d="${lin}"/>${pf}<text x="${pl}" y="${H - 6}">${fmtCorto(ps[0].fecha)}</text><text x="${W - pr}" y="${H - 6}" text-anchor="end">${fmtCorto(ps.at(-1).fecha)}</text></svg>`;
}

/* ---------- propuestas de fecha ---------- */
function fechaUI(d) {
  const m = window.MODO_FECHA || '1', MESC = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  const DIAS = ['DOM', 'LUN', 'MAR', 'MIÉ', 'JUE', 'VIE', 'SÁB'];
  const otroAnio = d.getFullYear() !== new Date().getFullYear();
  const dd = Math.round((aFecha(hoy()) - d) / 864e5);
  const rel = dd === 0 ? 'Hoy' : dd === 1 ? 'Ayer' : dd < 7 ? `Hace ${dd} días` : dd < 35 ? `Hace ${Math.round(dd / 7)} sem` : dd < 365 ? (Math.round(dd / 30.4) === 1 ? 'Hace 1 mes' : `Hace ${Math.round(dd / 30.4)} meses`) : `Hace ${Math.floor(dd / 365)} ${Math.floor(dd / 365) === 1 ? 'año' : 'años'}`;
  if (m === '1') return `<span class="fu1">${d.getDate()} ${MESC[d.getMonth()]}${otroAnio ? ` ${String(d.getFullYear()).slice(2)}` : ''}</span>`;
  if (m === '2') return `<span class="fu2"><b>${d.getDate()}</b><i>${MESC[d.getMonth()].toUpperCase()}${otroAnio ? ' ' + String(d.getFullYear()).slice(2) : ''}</i></span>`;
  if (m === '3') return `<span class="fu3"><b>${rel}</b><i>${d.getDate()} ${MESC[d.getMonth()]} ${d.getFullYear()}</i></span>`;
  if (m === '4') return `<span class="fu4"><i>${DIAS[d.getDay()]}</i><b>${d.getDate()}</b><em>${MESC[d.getMonth()]}${otroAnio ? ' ' + String(d.getFullYear()).slice(2) : ''}</em></span>`;
  return `<span class="fu5"><b>${d.getDate()}</b><i>${MESC[d.getMonth()].toUpperCase()}${otroAnio ? ' ' + String(d.getFullYear()).slice(2) : ''}</i></span>`;
}
let verPesos = false;
function renderPeso() {
  const ps = pesos(), ult = ps.at(-1), prev = ps.at(-2);
  let h = '';
  if (ult) {
    const dif = prev ? ult.kg - prev.kg : 0;
    h += `<div class="card peso-graf"><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px"><div><div class="s">Último peso · ${fmt(ult.fecha)}</div><div class="grande" style="font-size:34px">${num(ult.kg)} kg</div></div>${prev ? `<span class="pill ${Math.abs(dif) < .05 ? 'neutro' : 'ok'}">${dif > 0 ? '+' : ''}${num(Math.round(dif * 100) / 100)} kg</span>` : ''}</div><div class="graf-caja" id="grafCaja"></div></div>`;
  }
  const regs = ps.slice().reverse();
  const MES = ['ENE', 'FEB', 'MAR', 'ABR', 'MAY', 'JUN', 'JUL', 'AGO', 'SEP', 'OCT', 'NOV', 'DIC'];
  const mP = window.MODO_PESO || 'b';
  const kgMin = Math.min(...ps.map(x => x.kg)), kgMax = Math.max(...ps.map(x => x.kg));
  const filaPeso = p => {
    const d = aFecha(p.fecha), i = regs.indexOf(p), ant = regs[i + 1];
    const dif = ant ? Math.round((p.kg - ant.kg) * 10) / 10 : null;
    const difTxt = dif === null ? '' : dif === 0 ? '=' : (dif > 0 ? '▲ ' : '▼ ') + num(Math.abs(dif));
    const abrir = `formPeso(D.peso.find(x=>x.id==='${p.id}'))`;
    if (mP === 'a') return `<button class="pa-fila" onclick="${abrir}"><div class="pa-kg"><b>${num(p.kg)}</b><span>kg</span>${difTxt ? `<em class="${dif > 0 ? 'sube' : dif < 0 ? 'baja' : ''}">${difTxt}</em>` : ''}</div><div class="pa-cal"><span>${MES[d.getMonth()]}</span><b>${d.getDate()}</b><i>${d.getFullYear()}</i></div></button>`;
    if (mP === 'b') return `<button class="pb-fila" onclick="${abrir}"><div class="pb-kg">${num(p.kg)} <span>kg</span>${p.nota ? `<small>${esc(p.nota)}</small>` : ''}</div>${fechaUI(d)}</button>`;
    const pct = kgMax > kgMin ? (p.kg - kgMin) / (kgMax - kgMin) : .5;
    return `<button class="pc-fila" onclick="${abrir}"><div class="pc-kg"><b>${num(p.kg)} kg</b><div class="pc-barra"><i style="width:${(15 + pct * 85).toFixed(0)}%"></i></div></div><div class="pc-fecha"><b>${pad(d.getDate())}</b><span>${MES[d.getMonth()]}<br>${d.getFullYear()}</span></div></button>`;
  };
  const resto = regs.slice(4);
  h += `<div class="sec"><h2>Registros</h2>${regs.length ? `<span class="s">${regs.length}</span>` : ''}</div><div class="card peso-regs">${regs.length ? regs.slice(0, 4).map(filaPeso).join('') + (resto.length ? `<div class="pliegue ${verPesos ? 'abierto' : ''}">${verPesos ? resto.map(filaPeso).join('') : ''}<button class="pliegue-btn" onclick="verPesos=!verPesos;render()">${verPesos ? 'Ocultar anteriores' : `Ver ${resto.length} ${resto.length === 1 ? 'registro anterior' : 'registros anteriores'}`}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button></div>` : '') : vacioHTML('⚖️', 'Apunta su peso de vez en cuando (en casa o en el veterinario) y verás la evolución.')}</div>`;
  const v = $('#v-peso');
  v.innerHTML = conIconos(h);
  ajustarPeso();
}
function ajustarPeso() {
  const v = $('#v-peso'); if (!v || tab !== 'peso') return;

/* ---------- hoja y formularios ---------- */
function abrirHoja(h) { $('#hoja').innerHTML = conIconos(h); $('#velo').classList.add('abierto'); $('#hoja').scrollTop = 0; }
function cerrarHoja() { $('#velo').classList.remove('abierto'); $('#hoja').innerHTML = ''; }
$('#velo').addEventListener('click', e => { if (e.target.id === 'velo') cerrarHoja(); });

function campo(c, val) {
  const id = 'f_' + c.k;
  val = val ?? c.def ?? '';
  let inp;
  if (c.t === 'area') inp = `<textarea id="${id}" name="${c.k}" placeholder="${esc(c.ph || '')}">${esc(val)}</textarea>`;
  else if (c.t === 'sel') inp = `<select id="${id}" name="${c.k}">${c.op.map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(ov)}" ${String(ov) === String(val) ? 'selected' : ''}>${esc(ol)}</option>`; }).join('')}</select>`;
  else {
    const tipo = c.t === 'number' ? 'text' : (c.t || 'text');
    const extra = c.t === 'number' ? 'inputmode="decimal"' : c.t === 'tel' ? 'inputmode="tel"' : '';
    inp = `<input id="${id}" name="${c.k}" type="${tipo}" ${extra} value="${esc(c.t === 'number' && val !== '' ? String(val).replace('.', ',') : val)}" placeholder="${esc(c.ph || '')}" ${c.list ? `list="dl_${c.k}"` : ''}>`;
    if (c.list) inp += `<datalist id="dl_${c.k}">${c.list.map(x => `<option value="${esc(x)}">`).join('')}</datalist>`;
  }
  return `<div class="campo"><label for="${id}">${esc(c.l)}</label>${inp}</div>`;
}

function formulario(o) {
  const v = o.v || {};
  let h = `<div class="asa"></div><div class="hoja-tit"><h3>${esc(o.titulo)}</h3><button type="button" class="cerrar" onclick="cerrarHoja()" aria-label="Cerrar">✕</button></div>${o.html || ''}<form id="frm" autocomplete="off" novalidate>`;
  let buf = [];
  const flush = () => { if (buf.length) { h += buf.length === 2 ? `<div class="dos">${buf.join('')}</div>` : buf[0]; buf = []; } };
  for (const c of o.campos) {
    if (c.t === 'sep') { flush(); h += `<div class="subt">${esc(c.l)}</div>`; continue; }
    const html = campo(c, v[c.k]);
    if (c.half) { buf.push(html); if (buf.length === 2) flush(); } else { flush(); h += html; }
  }
  flush();
  h += `${o.htmlFin || ''}<div class="acciones"><button class="btn" type="submit">Guardar</button>${(o.extra || []).map((e, i) => `<button type="button" class="btn sec" data-extra="${i}">${esc(e.t)}</button>`).join('')}${o.borrar ? '<button type="button" class="btn peligro" data-borrar>Borrar</button>' : ''}</div></form>`;
  abrirHoja(h);
  const f = $('#frm');
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const r = {};
    for (const c of o.campos) {
      if (c.t === 'sep') continue;
      let x = f.elements[c.k].value.trim();
      if (c.t === 'number') { x = x === '' ? '' : parseFloat(x.replace(/\./g, '').replace(',', '.')); if (Number.isNaN(x)) x = ''; }
      r[c.k] = x;
    }
    if (o.validar) { const err = o.validar(r); if (err) return toast(err); }
    const btn = f.querySelector('[type=submit]'); btn.disabled = true;
    try { if ((await o.guardar(r)) !== false) cerrarHoja(); } finally { btn.disabled = false; }
  });
  f.querySelectorAll('[data-extra]').forEach(b => b.onclick = () => o.extra[b.dataset.extra].fn(f));
  const bb = f.querySelector('[data-borrar]');
  if (bb) bb.onclick = () => { if (confirm('¿Borrar este registro?')) { o.borrar(); cerrarHoja(); } };
  if (o.alCambiar) { f.addEventListener('input', e => o.alCambiar(f, e.target.name)); f.addEventListener('change', e => o.alCambiar(f, e.target.name)); }
  if (o.iniciar) o.iniciar(f);
  return f;
}
// Para números con decimales (8,5 kg) en campos de texto
const leerNum = s => { const x = parseFloat(String(s).replace(/\./g, '').replace(',', '.')); return Number.isNaN(x) ? '' : x; };

function qrSVG(texto) {
  try {
    const q = qrcode(0, 'M'); q.addData(texto); q.make();
    const n = q.getModuleCount(); let d = '';
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (q.isDark(y, x)) d += `M${x} ${y}h1v1h-1z`;
    return `<svg viewBox="-2 -2 ${n + 4} ${n + 4}" shape-rendering="crispEdges" aria-hidden="true"><rect x="-2" y="-2" width="${n + 4}" height="${n + 4}" fill="#fff"/><path d="${d}" fill="#14323A"/></svg>`;
  } catch { return ''; }
}

/* Tratamiento de una consulta -> medicación (automático) */
function medDeTratamiento(c) {
  const t = (c.tratamiento || '').trim(); if (!t) return null;
  let dias = 0, mm;
  const NUM = { un: 1, una: 1, dos: 2, tres: 3, cuatro: 4, cinco: 5, seis: 6, siete: 7, ocho: 8, nueve: 9, diez: 10, quince: 15, veinte: 20, treinta: 30 };
  const sinCada = t.replace(/cada\s+\d+\s*(h|horas?|d[ií]as?|semanas?)\b/gi, ' ').replace(/\b(un|una|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|quince|veinte|treinta)\s+(d[ií]as?|semanas?|mes(es)?)\b/gi, (m0, n, u) => NUM[n.toLowerCase()] + ' ' + u);
  if ((mm = sinCada.match(/durante\s+(\d+)\s*d[ií]as?/i) || sinCada.match(/(\d+)\s*d[ií]as?/i))) dias = +mm[1];
  else if ((mm = sinCada.match(/(\d+)\s*semanas?/i))) dias = +mm[1] * 7;
  else if ((mm = sinCada.match(/(\d+)\s*mes(es)?/i))) dias = +mm[1] * 30;
  const frec = (t.match(/cada\s+\d+\s*(h|horas?)\b/i) || t.match(/cada\s+\d+\s*d[ií]as?\b/i) || [''])[0];
  const dosis = (t.match(/\d+(?:[.,]\d+)?\s*(ml|mg|gotas?|comprimidos?|pastillas?|cápsulas?)\b/i) || [''])[0];
  const comunes = /^(Reposo|Limpiar|Revisión|Revision|Paseos|Dieta|Evitar|Volver|Control|Tratamiento|Aplicar|Dar|Cada|Durante|Con|Sin|Pienso)$/i;
  const nombres = [...t.matchAll(/\b([A-ZÁÉÍÓÚ][a-záéíóúñ]{3,}(?:\s+(?:Plus|Forte|Retard))?)\b/g)].map(x => x[1]).filter(w => !comunes.test(w));
  return {
    id: 'med-' + c.id, consulta: c.id, auto: true,
    nombre: nombres[0] || `Tratamiento · ${c.motivo || 'consulta'}`,
    dosis, frecuencia: frec, inicio: c.fecha || hoy(), fin: dias ? sumarDias(c.fecha || hoy(), dias - 1) : (c.fecha && diasHasta(c.fecha) < -14 ? c.fecha : ''),
    motivo: c.motivo || '', notas: t,
  };
}
function aplicarTratamiento(c, avisar) {
  const nueva = medDeTratamiento(c), i = D.medicacion.findIndex(x => x.id === 'med-' + c.id);
  const actual = i >= 0 ? D.medicacion[i] : null;
  if (!nueva) return;
  if (actual && (actual.borrado || actual.auto === false)) return; // borrada o editada a mano: no tocar
  if (actual && actual.notas === nueva.notas && actual.inicio === nueva.inicio && actual.motivo === nueva.motivo) return;
  guardarItem('medicacion', { ...(actual || {}), ...nueva });
  if (avisar) toast(actual ? 'Medicación actualizada' : 'Tratamiento añadido a Medicación');
}

const idb = (() => {
  let p;
  const abrir = () => p || (p = new Promise((ok, ko) => { const r = indexedDB.open('mi-mascota', 1); r.onupgradeneeded = () => r.result.createObjectStore('archivos'); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); }));
  const tx = async (modo, fn) => { const db = await abrir(); return new Promise((ok, ko) => { const t = db.transaction('archivos', modo); const q = fn(t.objectStore('archivos')); t.oncomplete = () => ok(q && q.result); t.onerror = () => ko(t.error); }); };
  return { get: k => tx('readonly', s => s.get(k)), set: (k, v) => tx('readwrite', s => s.put(v, k)), del: k => tx('readwrite', s => s.delete(k)) };
})();
async function cargarImagen(file) {
  const url = URL.createObjectURL(file);
  try { const img = new Image(); img.src = url; await img.decode(); return img; }
  finally { setTimeout(() => URL.revokeObjectURL(url), 2000); }
}
function lienzo(img, max) {
  const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height); return c;
}
function recortarCuadrado(img, lado) {
  const s = Math.min(img.naturalWidth, img.naturalHeight), c = document.createElement('canvas'); c.width = c.height = lado;
  c.getContext('2d').drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, lado, lado); return c;
}
const aBlob = (c, q) => new Promise(r => c.toBlob(r, 'image/jpeg', q));
const blobA64 = b => new Promise((ok, ko) => { const fr = new FileReader(); fr.onload = () => ok(fr.result.split(',')[1]); fr.onerror = ko; fr.readAsDataURL(b); });
const a64Blob = (s, mime) => { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type: mime }); };

async function prepararArchivo(file) {
  const id = uid();
  let blob = file, mime = file.type || (/\.pdf$/i.test(file.name) ? 'application/pdf' : 'application/octet-stream'), thumb = '';
  if (mime.startsWith('image/')) {
    const img = await cargarImagen(file);
    blob = await aBlob(lienzo(img, 2000), .85); mime = 'image/jpeg';
    thumb = lienzo(img, 360).toDataURL('image/jpeg', .7);
  }
  if (blob.size > 25e6) throw new Error('grande');
  await idb.set(id, blob);
  return { id, mime, tam: blob.size, thumb, localKey: id };
}

/* ---------- sincronización con Google (Apps Script) ---------- */
let syncTimer = null, sincronizando = false, otraVez = false;
let estadoActual = '';
function estado(e) { estadoActual = e || ''; $('#estado').className = 'estado ' + estadoActual; pintarEstado(); }
function pintarEstado() { const el = $('#estado-txt'); if (el) el.className = 'estado ' + estadoActual; }
function programarSync(ms = 1500) { clearTimeout(syncTimer); if (CFG.url) syncTimer = setTimeout(() => sincronizar(), ms); }
async function api(accion, extra = {}) {
  let r;
  try { r = await fetch(CFG.url, { method: 'POST', body: JSON.stringify({ clave: CFG.clave, accion, ...extra }) }); }
  catch { throw new Error('No se puede contactar con el script. Revisa que la dirección esté bien copiada y termine en /exec.'); }
  if (r.status === 404) throw new Error('La dirección del script no existe. Copia de nuevo la URL de la implementación (termina en /exec).');
  if (!r.ok) throw new Error('El script respondió con un error (' + r.status + ').');
  let j;
  try { j = await r.json(); }
  catch { throw new Error('Google pide iniciar sesión. En «Implementar», el acceso debe ser «Cualquier usuario» (no «con cuenta de Google»).'); }
  if (j.error) throw new Error(j.error === 'Contraseña incorrecta' ? 'Contraseña incorrecta: debe ser la misma que pusiste en CLAVE dentro del script.' : j.error);
  return j;
}
async function sincronizar(manual) {
  if (!CFG.url) { estado(''); if (manual) toast('Configura primero la dirección del script'); return; }
  if (!navigator.onLine) { estado('error'); return; }
  if (sincronizando) { otraVez = true; return; }
  sincronizando = true; estado('sync');
  try {
    for (const d of D.docs.filter(x => !x.borrado && !x.driveId)) {
      const b = await idb.get(d.id).catch(() => null); if (!b) continue;
      const r = await api('subirDoc', { nombre: `${d.fecha || hoy()} ${d.nombre || 'documento'}${ext(d.mime)}`, mime: d.mime, base64: await blobA64(b) });
      const i = D.docs.findIndex(x => x.id === d.id);
      if (i >= 0 && !D.docs[i].borrado) { D.docs[i] = { ...D.docs[i], driveId: r.driveId, url: r.url, upd: Date.now() }; guardarLocal(); }
    }
    const r = await api('sincronizar', { datos: D });
    D = Object.assign(vacio(), fusionar(D, r.datos));
    guardarLocal(); localStorage.setItem('mm-ultima', Date.now()); localStorage.removeItem('mm-error');
    if (r.calendario) localStorage.setItem('mm-aviso-cal', r.calendario); else localStorage.removeItem('mm-aviso-cal');
    render(); estado('ok');
    if (manual) toast('Sincronizado');
  } catch (e) {
    estado('error');
    try { localStorage.setItem('mm-error', navigator.onLine ? e.message : 'Sin conexión a internet.'); } catch { }
    if (manual) toast('No se pudo sincronizar');
  } finally {
    sincronizando = false;
    if (otraVez) { otraVez = false; programarSync(500); }
  }
}

function htmlEstadoSync() {
  const ult = Number(localStorage.getItem('mm-ultima') || 0), err = localStorage.getItem('mm-error'), cal = localStorage.getItem('mm-aviso-cal');
  const cuando = ult ? new Date(ult).toLocaleString('es-ES', { dateStyle: 'medium', timeStyle: 'short' }) : '';
  let cls = 'neutro', tit, txt = '';
  if (!CFG.url) { tit = 'Sin configurar'; txt = 'Los datos solo están en este dispositivo.'; }
  else if (err) { cls = 'mal'; tit = 'No se pudo sincronizar'; txt = err + (cuando ? `<br>Última vez que funcionó: ${cuando}.` : ''); }
  else if (ult) { cls = 'bien'; tit = 'Sincronización funcionando'; txt = `Última vez: ${cuando}.` + (cal ? `<br>Pero los avisos del calendario fallan: ${esc(cal)}. Ejecuta «autorizar» otra vez en el script.` : ''); }
  else { tit = 'Aún no se ha sincronizado'; txt = 'Pulsa «Guardar y sincronizar».'; }
  return `<div class="estado-sync ${cls}" id="estadoSync"><b>${tit}</b><span>${txt}</span></div>`;
}

  ${htmlEstadoSync()}
  <div class="acciones" style="margin-top:10px"><button class="btn" onclick="guardarAjustes()">Guardar y sincronizar</button></div>
  <div class="nota">Con la sincronización activa, los datos se guardan en tu Google Drive (carpeta «Mi Mascota»), los documentos se suben a «Mi Mascota/Documentos» y los avisos se crean en un calendario «Mi Mascota».</div>
  <div class="subt">Copia de seguridad</div>
  <div class="acciones" style="margin-top:10px"><button class="btn sec" onclick="exportar()">Descargar copia (sin archivos)</button><button class="btn sec" onclick="$('#fimp').click()">Restaurar una copia</button></div>
  <input type="file" id="fimp" accept="application/json,.json" hidden>
  <div class="s" style="text-align:center;margin-top:22px">Mi Mascota · ${VERSION}</div>`);
  $('#fimp').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const x = JSON.parse(await f.text()); D = Object.assign(vacio(), fusionar(D, x.datos || x)); cambio(); toast('Copia restaurada'); cerrarHoja(); }
    catch { toast('Ese archivo no es una copia válida'); }
  };
}
async function guardarAjustes() {
  CFG = { url: $('#cfgUrl').value.trim(), clave: $('#cfgClave').value };
  localStorage.setItem('mm-cfg', JSON.stringify(CFG));
  localStorage.removeItem('mm-error');
  render();
  const el = $('#estadoSync');
  if (!CFG.url) { estado(''); if (el) el.outerHTML = htmlEstadoSync(); return; }
  if (el) el.outerHTML = '<div class="estado-sync" id="estadoSync"><b>Comprobando…</b><span>Conectando con tu Google.</span></div>';
  await sincronizar(true);
  const el2 = $('#estadoSync'); if (el2) el2.outerHTML = htmlEstadoSync();
}
function exportar() {
  const b = new Blob([JSON.stringify({ app: 'Mi Mascota', version: VERSION, fecha: new Date().toISOString(), datos: D }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `mi-mascota-copia-${hoy()}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}



/* ---------- historial de rabia copiado del pasaporte (una sola vez; ids fijos para no duplicar entre dispositivos) ---------- */
const HISTORIAL_PASAPORTE = []; // datos retirados del historial publico
setTimeout(() => vivos('consultas').forEach(c => aplicarTratamiento(c, false)), 0);
(function importarRabia() {
  let n = 0;
  for (const v of HISTORIAL_PASAPORTE) if (!D.salud.some(x => x.id === v.id)) { D.salud.push({ ...v, upd: 1 }); n++; }
  if (n) guardarLocal();
})();

/* ---------- arranque ---------- */
document.body.classList.add('menu-a');
pintarTema();
render();
estado(CFG.url ? '' : '');
if (CFG.url) sincronizar();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { render(); sincronizar(); } });
setInterval(() => { if (document.visibilityState === 'visible' && CFG.url) sincronizar(); }, 30000);
addEventListener('online', () => sincronizar());
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  // Si hay una versión nueva, se instala y la app se recarga sola una vez
  let recargando = false;
  const habiaControl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (habiaControl && !recargando) { recargando = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    reg.update().catch(() => { });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => { }); });
  }).catch(() => { });
}
</script>
